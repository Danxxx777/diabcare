<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare - Agenda</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/estaticos/estilos.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/dashboard.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/animaciones.css?v=contrast-1">
<style>
.agenda-workspace{display:grid;gap:12px;align-items:start}.agenda-control{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.agenda-control .stats-grid{margin:0!important}.agenda-filtros{display:flex;align-items:end;gap:9px}.agenda-filtros label{display:grid;gap:5px;color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.agenda-filtros .search{width:170px}.agenda-lista .tabla-top{grid-template-columns:minmax(220px,1fr);margin-bottom:12px}
.agenda-lista .data-grid{display:grid;gap:9px}.agenda-lista .data-tile{position:relative;padding-left:22px;border-radius:15px;border-left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 9%,var(--surface)),var(--surface) 35%)}.agenda-lista .data-tile:before{content:"";position:absolute;left:8px;top:17px;bottom:17px;width:3px;border-radius:3px;background:var(--primary)}.agenda-lista .data-tile-meta{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.agenda-control{grid-template-columns:1fr}.agenda-filtros{justify-content:flex-start}}@media(max-width:650px){.agenda-filtros{display:grid;grid-template-columns:1fr;width:100%}.agenda-filtros .search,.agenda-lista .data-tile-meta{width:100%}.agenda-lista .data-tile-meta{grid-template-columns:1fr}}
</style>
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/i18n.js?v=text-36"></script>
<script src="/estaticos/navegacion.js?v=text-36"></script>
<script src="/estaticos/api.js?v=text-36"></script>
</head>
<body class="dc-uv">
<aside class="sidebar" id="diabcare-sidebar"></aside>
<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Agenda</span>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Recepción <span>/ turnos</span></div>
        <div class="page-sub">Programación y asignación de turnos médicos</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Separar turno</button>
      </div>
    </div>
    <div class="agenda-workspace">
      <aside class="agenda-control">
        <div class="stats-grid" style="display:none!important">
          <div class="stat-card"><div class="stat-label">Turnos (día)</div><div class="stat-value blue" id="st-hoy">-</div></div>
          <div class="stat-card"><div class="stat-label">Cobro pendiente</div><div class="stat-value amber" id="st-cobro">-</div></div>
          <div class="stat-card"><div class="stat-label">Consultas cobradas</div><div class="stat-value green" id="st-pagado">-</div></div>
        </div>
        <div class="agenda-filtros">
          <label>Fecha<input class="search" id="f-fecha" type="date" onchange="pag=1;cargarHoy();cargar()"></label>
          <label>Estado<select class="search" id="f-estado" onchange="pag=1;cargar()"><option value="">Todos los estados</option><option value="programada">Programada</option><option value="confirmada">Confirmada</option><option value="atendida">Atendida</option><option value="cancelada">Cancelada</option></select></label>
        </div>
      </aside>
    <div class="tabla-card agenda-lista">
      <div class="tabla-top">
        <input class="search" id="f-q" type="search" autocomplete="off" placeholder="Paciente, médico o motivo referido…">
      </div>
      <div class="tabla-wrap"><div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></div>
      <div id="dataPager" class="data-pager" hidden></div>
    </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>
<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal-card modal-md">
    <div class="modal-header"><span id="modal-titulo">Separar turno</span></div>
    <div class="modal-body form-modal-grid">
      <input type="hidden" id="f-id">
      <label class="span-full pac-typeahead-wrap">Paciente (cédula o nombre)
        <input type="hidden" id="m-paciente" value="">
        <input class="pac-typeahead-q" type="search" id="m-paciente-q" placeholder="Escribe cédula o nombre…" autocomplete="off">
        <div id="m-paciente-res" class="pac-suggest" hidden></div>
        <div id="m-paciente-chip" class="pac-chip" style="display:none"></div>
      </label>
      <label class="span-full">Médico que atenderá
        <select id="m-medico" required></select>
      </label>
      <label>Fecha<input id="m-fecha" type="date"></label>
      <label>Hora<input id="m-hora" type="time" value="09:00" min="08:00" max="17:59" step="300"></label>
      <p class="span-full field-hint">Consulta programada: lunes a viernes, 08:00-18:00. Fuera de ese horario, registre en Urgencias.</p>
      <label class="span-full">Qué refiere el paciente (aprox.)
        <input id="m-motivo" placeholder="Ej. control glucosa, dolor de pie, mareos…">
      </label>
      <label class="span-full">Notas de recepción<textarea id="m-notas" rows="2" placeholder="Observaciones del mostrador (no sustituyen la historia clínica)"></textarea></label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="guardar()">Guardar turno</button>
    </div>
  </div>
</div>
<script>
DiabCareNav.init();
DiabCareNav.guardRol(['administrador', 'farmaceutico', 'enfermero']);
const API = DiabCareNav.getApi();
const token = localStorage.getItem('token');
const _rol = String((JSON.parse(localStorage.getItem('usuario') || '{}').rol || '')).toLowerCase();
let pag = 1;
let _totalRows = 0;
const LIMIT = (typeof DiabCareAPI !== 'undefined' && DiabCareAPI.GRID_PAGE_SIZE) || 9;
let _rows = [];
let _medicos = [];
let _pacTA = null;

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  document.getElementById('t-msg').textContent = msg;
  document.getElementById('t-icon').textContent = type === 'success' ? '✓' : '✗';
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function cargarMedicos() {
  const r = await fetch(`${API}/api/usuarios/medicos`, { headers: { Authorization: 'Bearer '+token } });
  if (r.ok) _medicos = (await r.json()).medicos || [];
}

async function cargarHoy() {
  if (document.querySelector('.agenda-control .stats-grid')?.style.display === 'none') return;
  const fecha = document.getElementById('f-fecha').value || '';
  const qs = fecha ? `?fecha=${encodeURIComponent(fecha)}` : '';
  const r = await fetch(`${API}/api/citas/resumen${qs}`, { headers: { Authorization: 'Bearer '+token } });
  if (!r.ok) return;
  const j = await r.json();
  document.getElementById('st-hoy').textContent = j.total ?? 0;
  document.getElementById('st-cobro').textContent = j.cobro_pendiente ?? 0;
  document.getElementById('st-pagado').textContent = j.cobro_pagado ?? 0;
}

async function cargar() {
  const fecha = document.getElementById('f-fecha').value;
  const estado = document.getElementById('f-estado').value;
  const q = document.getElementById('f-q')?.value.trim() || '';
  const rel = DiabCareAPI.listUrlWithPage('/api/citas/', {
    page: pag,
    pageSize: LIMIT,
    q,
    extra: { fecha, estado },
  });
  const url = `${API}${rel}`;
  const r = await fetch(url, { headers: { Authorization: 'Bearer '+token }, cache: 'no-store' });
  if (r.status === 401) { window.location.href = '/'; return; }
  const data = await r.json();
  _rows = data.citas || [];
  _totalRows = Number(data.total) || 0;
  if (!_rows.length) {
    document.getElementById('tablaBody').innerHTML = q
      ? `<div class="loading">Sin coincidencias para “${q.replace(/[<>&]/g, '')}”</div>`
      : '<div class="loading">Sin citas</div>';
    DiabCareAPI.renderPager(document.getElementById('dataPager'), {
      page: pag, pageSize: LIMIT, total: _totalRows,
      onPage: (p) => { pag = p; cargar(); },
    });
    return;
  }
  const body = document.getElementById('tablaBody');
  body.innerHTML = DiabCareAPI.buildDataGrid({
    rows: _rows,
    idField: 'id_cita',
    columns: [
      { key: 'paciente_nombre', label: 'Paciente', title: true },
      { key: 'estado', label: 'Estado', badge: true, render: c =>
        c.estado_label || (typeof DiabCareAPI !== 'undefined' ? DiabCareAPI.capLabel(c.estado) : c.estado) || '-' },
      { key: 'fecha', label: 'Fecha' },
      { key: 'hora', label: 'Hora' },
      { key: 'medico', label: 'Médico' },
      { key: 'motivo', label: 'Motivo' },
    ],
    actionsHtml: (c, id) => {
      const acciones = [
        `<button type="button" class="btn btn-ghost btn-sm" data-edit="${id}">Editar</button>`,
        `<button type="button" class="btn btn-ghost btn-sm" data-cancel="${id}">Cancelar</button>`,
      ];
      if (_rol === 'administrador' && !['cancelada', 'atendida'].includes(c.estado)) {
        acciones.unshift(`<button type="button" class="btn btn-primary btn-sm" data-reasignar="${id}">Reasignar médico</button>`);
      }
      return acciones.join(' ');
    },
  });
  body.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => editar(btn.getAttribute('data-edit'));
  });
  body.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.onclick = () => cancelar(btn.getAttribute('data-cancel'));
  });
  body.querySelectorAll('[data-reasignar]').forEach(btn => {
    btn.onclick = () => reasignarMedico(btn.getAttribute('data-reasignar'));
  });
  DiabCareAPI.renderPager(document.getElementById('dataPager'), {
    page: pag, pageSize: LIMIT, total: _totalRows,
    onPage: (p) => { pag = p; cargar(); },
  });
}

function llenarMedicos(selected) {
  const sel = document.getElementById('m-medico');
  sel.innerHTML = _medicos.length
    ? _medicos.map(m => `<option value="${(m.nombre || '').replace(/"/g, '&quot;')}">${m.nombre || 'Médico sin nombre'}</option>`).join('')
    : '<option value="">- Registre un usuario con rol Médico -</option>';
  if (selected) {
    const match = [...sel.options].find(o => o.value === selected);
    sel.value = match ? selected : (sel.options[0]?.value || '');
  } else if (_medicos.length) {
    sel.value = _medicos[0].nombre || '';
  }
}

async function abrirModal(c) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modal-titulo').textContent = c ? 'Editar turno' : 'Separar turno';
  document.getElementById('f-id').value = c?.id_cita || '';
  if (!_pacTA) {
    _pacTA = DiabCareAPI.mountPacienteTypeahead({ field: 'paciente' });
  }
  if (c?.id_paciente) {
    await _pacTA.setPaciente(c.id_paciente, c.paciente_nombre || '');
  } else {
    _pacTA.clear();
  }
  llenarMedicos(c?.medico || '');
  document.getElementById('m-fecha').value = (c?.fecha || new Date().toISOString().slice(0, 10)).slice(0, 10);
  document.getElementById('m-hora').value = c?.hora || '09:00';
  document.getElementById('m-motivo').value = c?.motivo || '';
  document.getElementById('m-notas').value = c?.notas || '';
  if (!c?.id_paciente) setTimeout(() => document.getElementById('m-paciente-q').focus(), 50);
}

async function reasignarMedico(id) {
  const cita = _rows.find(c => String(c.id_cita) === String(id));
  if (!cita) return;
  await abrirModal(cita);
  document.getElementById('modal-titulo').textContent = 'Reasignar médico';
  setTimeout(() => document.getElementById('m-medico').focus(), 50);
}
function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
function editar(id) { abrirModal(_rows.find(x => x.id_cita === id)); }

async function guardar() {
  const id = document.getElementById('f-id').value;
  const body = {
    id_paciente: document.getElementById('m-paciente').value.trim(),
    medico: document.getElementById('m-medico').value.trim(),
    fecha: document.getElementById('m-fecha').value,
    hora: document.getElementById('m-hora').value,
    motivo: document.getElementById('m-motivo').value.trim(),
    notas: document.getElementById('m-notas').value.trim(),
  };
  // Nuevo turno siempre programada; cobro en caja → confirmada; médico → atendida.
  if (!id) body.estado = 'programada';
  if (!body.id_paciente) { toast('Busque y seleccione un paciente por cédula', 'error'); return; }
  if (!body.medico) { toast('Seleccione un médico', 'error'); return; }
  const errH = DiabCareAPI.enHorarioConsulta(body.fecha, body.hora);
  if (errH) { toast(errH, 'error'); return; }
  const url = id ? `${API}/api/citas/${id}` : `${API}/api/citas/`;
  const r = await fetch(url, {
    method: id ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer '+token },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) { toast(d.detail || d.error || 'Error', 'error'); return; }
  toast(id ? 'Turno actualizado' : 'Turno separado');
  cerrarModal();
  cargarHoy();
  cargar();
}

async function cancelar(id) {
  const ok = typeof DiabCareAPI !== 'undefined'
    ? await DiabCareAPI.confirm({ title: 'Cancelar turno', message: '¿Cancelar este turno?', confirmLabel: 'Cancelar turno', danger: true })
    : confirm('¿Cancelar esta cita?');
  if (!ok) return;
  const r = await fetch(`${API}/api/citas/${id}`, { method: 'DELETE', headers: { Authorization: 'Bearer '+token } });
  if (!r.ok) { toast('Error al cancelar', 'error'); return; }
  toast('Turno cancelado');
  cargarHoy();
  cargar();
}

document.getElementById('f-fecha').value = new Date().toISOString().slice(0, 10);
document.getElementById('m-fecha').min = new Date().toISOString().slice(0, 10);
DiabCareAPI.bindLiveSearch({ input: document.getElementById('f-q'), onSearch: () => { pag = 1; return cargar(); } });
cargarMedicos();
cargar();
</script>
</body>
</html>
