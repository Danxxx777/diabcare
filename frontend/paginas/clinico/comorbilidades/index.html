<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare - Comorbilidades</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/estaticos/estilos.css">
<link rel="stylesheet" href="/estaticos/dashboard.css">
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/navegacion.js"></script>
<script src="/estaticos/api.js"></script>
<script src="/estaticos/crud-modulo.js?v=20260716p"></script>
</head>
<body>
<aside class="sidebar" id="diabcare-sidebar"></aside>
<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Comorbilidades</span>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Comorbilidades</div>
        <div class="page-sub">Complicaciones asociadas a diabetes</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Registrar complicación</button>
      </div>
    </div>
    <div class="tabla-card">
      <div class="tabla-wrap"><div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>
<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal-card modal-md">
    <div class="modal-header"><span id="modal-titulo">Registrar complicación</span></div>
    <div class="modal-body form-modal-grid">
      <input type="hidden" id="f-id">
      <label class="span-full pac-typeahead-wrap">Paciente (cédula o nombre)
        <input type="hidden" id="m-id_paciente" value="">
        <input class="pac-typeahead-q" type="search" id="m-id_paciente-q" placeholder="Escribe cédula o nombre…" autocomplete="off">
        <div id="m-id_paciente-res" class="pac-suggest" hidden></div>
        <div id="m-id_paciente-chip" class="pac-chip" style="display:none"></div>
      </label>
      <label>Tipo de complicación
        <select id="m-tipo">
          <option value="retinopatia">Retinopatía</option>
          <option value="nefropatia">Nefropatía</option>
          <option value="neuropatia">Neuropatía</option>
          <option value="cardiovascular">Cardiovascular</option>
          <option value="pie_diabetico">Pie diabético</option>
        </select>
      </label>
      <label>Fecha de detección<input id="m-fecha_deteccion" type="date" required></label>
      <label class="span-full">Notas clínicas<textarea id="m-notas" rows="2" placeholder="Hallazgo, gravedad, seguimiento…"></textarea></label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="guardarCrud()">Guardar</button>
    </div>
  </div>
</div>
<script>
DiabCareNav.init();
DiabCareNav.guardRol(['administrador', 'medico']);
DiabCareCrud.mount({
  listUrl: '/api/comorbilidades/', listKey: 'comorbilidades', idField: 'id_comorbilidad',
  itemUrl: id => '/api/comorbilidades/' + id, createUrl: '/api/comorbilidades/',
  searchPlaceholder: 'Buscar por paciente, cédula o tipo…',
  lookups: [{
    field: 'id_paciente', url: '/api/pacientes/?limit=200', listKey: 'pacientes',
    idKey: 'id_paciente',
    label: p => (p.nombre_completo || ((p.nombre||'') + ' ' + (p.apellido||'')).trim() || 'Paciente')
  }],
  columns: [
    {
      key: 'paciente_nombre', label: 'Paciente',
      render: r => r.paciente_nombre || r.paciente_label || '—'
    },
    {
      key: 'documento', label: 'Cédula',
      render: r => r.documento || '—'
    },
    {
      key: 'tipo', label: 'Complicación',
      render: r => r.tipo_label || String(r.tipo || '—').replace(/_/g, ' ')
    },
    { key: 'fecha_deteccion', label: 'Detección' },
    {
      key: 'estado', label: 'Estado',
      render: r => r.estado_label || r.estado || '—'
    },
  ],
  fields: [
    { key: 'id_paciente', required: true, label: 'paciente' },
    { key: 'tipo' },
    { key: 'fecha_deteccion', required: true, label: 'fecha' },
    { key: 'notas' },
  ],
});
</script>
</body>
</html>
