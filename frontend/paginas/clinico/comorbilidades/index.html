<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare - Comorbilidades</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/estaticos/estilos.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/dashboard.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/animaciones.css?v=contrast-1">
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/i18n.js?v=text-36"></script>
<script src="/estaticos/navegacion.js?v=text-36"></script>
<script src="/estaticos/api.js?v=text-36"></script>
<script src="/estaticos/crud-modulo.js?v=text-36"></script>
</head>
<body class="dc-uv">
<aside class="sidebar" id="diabcare-sidebar"></aside>
<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Comorbilidades</span>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Comorbilidades</div>
        <div class="page-sub">Detección, severidad y seguimiento de complicaciones asociadas</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Registrar complicación</button>
      </div>
    </div>
    <div class="dash-row dash-3">
      <div class="kpi-card red">
        <div class="kpi-label">Complicaciones</div>
        <div class="kpi-val red" id="k-com-total">-</div>
        <div class="kpi-sub">activas registradas</div>
      </div>
      <div class="kpi-card cyan">
        <div class="kpi-label">Pacientes afectados</div>
        <div class="kpi-val cyan" id="k-com-pac">-</div>
        <div class="kpi-sub">con al menos una complicación</div>
      </div>
      <div class="kpi-card amber">
        <div class="kpi-label">Más frecuente</div>
        <div class="kpi-val amber" id="k-com-tipo" style="font-size:20px">-</div>
        <div class="kpi-sub">tipo predominante</div>
      </div>
    </div>
    <div class="tabla-card">
      <div class="tabla-wrap"><div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>
<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal-card modal-md">
    <div class="modal-header"><span id="modal-titulo">Registrar complicación</span></div>
    <div class="modal-body form-modal-grid">
      <input type="hidden" id="f-id">
      <label class="span-full pac-typeahead-wrap">Paciente (cédula o nombre)
        <input type="hidden" id="m-id_paciente" value="">
        <input class="pac-typeahead-q" type="search" id="m-id_paciente-q" placeholder="Escribe cédula o nombre…" autocomplete="off">
        <div id="m-id_paciente-res" class="pac-suggest" hidden></div>
        <div id="m-id_paciente-chip" class="pac-chip" style="display:none"></div>
      </label>
      <label>Tipo de complicación
        <select id="m-tipo">
          <option value="retinopatia">Retinopatía</option>
          <option value="nefropatia">Nefropatía</option>
          <option value="neuropatia">Neuropatía</option>
          <option value="cardiovascular">Cardiovascular</option>
          <option value="pie_diabetico">Pie diabético</option>
        </select>
      </label>
      <label>Fecha de detección<input id="m-fecha_deteccion" type="date" required></label>
      <label>Severidad
        <select id="m-severidad"><option value="leve">Leve</option><option value="moderada">Moderada</option><option value="severa">Severa</option></select>
      </label>
      <label>Estado
        <select id="m-estado"><option value="activa">Activa</option><option value="controlada">Controlada</option><option value="resuelta">Resuelta</option></select>
      </label>
      <label>Próximo seguimiento<input id="m-proximo_control" type="date"></label>
      <label class="span-full">Notas clínicas<textarea id="m-notas" rows="2" placeholder="Hallazgo, gravedad, seguimiento…"></textarea></label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="guardarCrud()">Guardar</button>
    </div>
  </div>
</div>
<script>
DiabCareNav.init();
DiabCareNav.guardRol(['administrador', 'medico', 'enfermero', 'analista']);

// Quien hace que: el medico diagnostica, enfermeria da seguimiento y el
// analista solo mira. Es el mismo reparto que ya existe en laboratorio.
const _rolCom = String((JSON.parse(localStorage.getItem('usuario') || '{}').rol || '')).toLowerCase();
const puedeDiagnosticar = ['administrador', 'medico'].includes(_rolCom);
const puedeSeguimiento = ['administrador', 'medico', 'enfermero'].includes(_rolCom);

// Informe simple: complicaciones por tipo y pacientes afectados
(async function kpisComorbilidades() {
  try {
    const r = await fetch(`${DiabCareNav.getApi()}/api/comorbilidades/resumen`, {
      headers: { Authorization: 'Bearer ' + localStorage.getItem('token') }, cache: 'no-store'
    });
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('k-com-total').textContent = d.total ?? '-';
    document.getElementById('k-com-pac').textContent = d.pacientes_afectados ?? '-';
    document.getElementById('k-com-tipo').textContent = d.tipo_mas_frecuente || 'Sin registros';
  } catch (_) { /* sin datos */ }
})();

async function abrirSeguimiento(row, ctx) {
  const hoy = new Date().toISOString().slice(0, 10);
  const actual = row.proximo_control || '';
  const fecha = prompt(
    `Control de ${row.paciente_nombre || 'paciente'} — ${row.tipo_label || row.tipo}\n\n` +
    `Fecha del próximo control (AAAA-MM-DD), vacío para dejarlo igual:`,
    actual || hoy);
  if (fecha === null) return;
  const estado = prompt(
    'Estado tras el control: activa, controlada o resuelta\n(vacío para dejarlo igual)',
    row.estado || 'activa');
  if (estado === null) return;

  const cuerpo = {};
  if (fecha.trim()) cuerpo.proximo_control = fecha.trim();
  if (estado.trim()) cuerpo.estado = estado.trim().toLowerCase();
  if (!Object.keys(cuerpo).length) return;

  const r = await fetch(`${DiabCareNav.getApi()}/api/comorbilidades/${row.id_comorbilidad}/seguimiento`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(cuerpo),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    DiabCareAPI.toast(d.detail || d.error || 'No se pudo registrar el control', 'error');
    return;
  }
  DiabCareAPI.toast('Control registrado');
  if (ctx && ctx.cargar) ctx.cargar();
}

DiabCareCrud.mount({
  listUrl: '/api/comorbilidades/', listKey: 'comorbilidades', idField: 'id_comorbilidad',
  itemUrl: id => '/api/comorbilidades/' + id, createUrl: '/api/comorbilidades/',
  searchPlaceholder: 'Buscar por paciente, cédula o tipo…',
  hideCreate: !puedeDiagnosticar,
  hideEdit: !puedeDiagnosticar,
  hideDelete: !puedeDiagnosticar,
  rowActions: puedeSeguimiento ? [{
    id: 'seguimiento',
    label: 'Registrar control',
    show: (row) => String(row.estado || '').toLowerCase() !== 'resuelta',
    onClick: (row, ctx) => abrirSeguimiento(row, ctx),
  }] : [],
  // Filtros por columna: ver de un vistazo las severas sin controlar.
  filtros: [
    { param: 'tipo', label: 'Toda complicación', options: [
      { value: 'cardiovascular', label: 'Cardiovascular' },
      { value: 'nefropatia', label: 'Nefropatía' },
      { value: 'neuropatia', label: 'Neuropatía' },
      { value: 'pie_diabetico', label: 'Pie diabético' },
      { value: 'retinopatia', label: 'Retinopatía' },
    ]},
    { param: 'severidad', label: 'Toda severidad', options: [
      { value: 'leve', label: 'Leve' },
      { value: 'moderada', label: 'Moderada' },
      { value: 'severa', label: 'Severa' },
    ]},
    { param: 'estado', label: 'Todo estado', options: [
      { value: 'activa', label: 'Activa' },
      { value: 'controlada', label: 'Controlada' },
      { value: 'resuelta', label: 'Resuelta' },
    ]},
  ],
  lookups: [{
    field: 'id_paciente', url: '/api/pacientes/?limit=200', listKey: 'pacientes',
    idKey: 'id_paciente',
    label: p => (p.nombre_completo || ((p.nombre||'') + ' ' + (p.apellido||'')).trim() || 'Paciente')
  }],
  columns: [
    {
      key: 'paciente_nombre', label: 'Paciente',
      render: r => r.paciente_nombre || r.paciente_label || '-'
    },
    {
      key: 'documento', label: 'Cédula',
      render: r => r.documento || '-'
    },
    {
      key: 'tipo', label: 'Complicación',
      render: r => r.tipo_label || String(r.tipo || '-').replace(/_/g, ' ')
    },
    { key: 'severidad', label: 'Severidad', badge: true, render: r => r.severidad_label || 'Moderada' },
    { key: 'fecha_deteccion', label: 'Detección' },
    { key: 'proximo_control', label: 'Seguimiento', render: r => r.proximo_control || 'Sin programar' },
    {
      key: 'estado', label: 'Estado',
      render: r => r.estado_label || r.estado || '-'
    },
  ],
  fields: [
    { key: 'id_paciente', required: true, label: 'paciente' },
    {
      key: 'tipo', required: true, labelUi: 'Complicación',
      type: 'select',
      options: [
        { value: 'cardiovascular', label: 'Cardiovascular' },
        { value: 'nefropatia', label: 'Nefropatía' },
        { value: 'neuropatia', label: 'Neuropatía' },
        { value: 'pie_diabetico', label: 'Pie diabético' },
        { value: 'retinopatia', label: 'Retinopatía' },
      ],
    },
    { key: 'fecha_deteccion', required: true, type: 'date', labelUi: 'Fecha detección' },
    {
      key: 'severidad', required: true, labelUi: 'Severidad', type: 'select',
      options: [
        { value: 'leve', label: 'Leve' },
        { value: 'moderada', label: 'Moderada' },
        { value: 'severa', label: 'Severa' },
      ],
    },
    {
      key: 'estado', required: true, labelUi: 'Estado', type: 'select',
      options: [
        { value: 'activa', label: 'Activa' },
        { value: 'controlada', label: 'Controlada' },
        { value: 'resuelta', label: 'Resuelta' },
      ],
    },
    { key: 'proximo_control', type: 'date', labelUi: 'Próximo seguimiento' },
    { key: 'notas', labelUi: 'Notas', full: true },
  ],
});

const hoy = new Date().toISOString().slice(0, 10);
document.getElementById('m-fecha_deteccion').max = hoy;
document.getElementById('m-proximo_control').min = hoy;
</script>
</body>
</html>
