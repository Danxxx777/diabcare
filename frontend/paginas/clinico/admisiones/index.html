<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare - Admisiones</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/estaticos/estilos.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/dashboard.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/animaciones.css?v=contrast-1">
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/i18n.js"></script>
<script src="/estaticos/navegacion.js?v=contrast-1"></script>
<script src="/estaticos/api.js?v=uv-11"></script>
</head>
<body class="dc-uv">
<aside class="sidebar" id="diabcare-sidebar"></aside>
<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Admisiones</span>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Admisiones <span>hospitalarias</span></div>
        <div class="page-sub">Ingresos hospitalarios</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Nueva admisión</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value blue" id="st-total">-</div></div>
      <div class="stat-card"><div class="stat-label">Activas</div><div class="stat-value green" id="st-activas">-</div></div>
      <div class="stat-card"><div class="stat-label">Altas</div><div class="stat-value" id="st-altas">-</div></div>
    </div>
    <div class="tabla-card">
      <div class="tabla-top">
        <input class="search" id="f-q" type="search" autocomplete="off" placeholder="Escribe paciente, cédula, médico o servicio…">
      </div>
      <div class="tabla-wrap"><div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></div>
      <div id="dataPager" class="data-pager" hidden></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>
<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal-card modal-md">
    <div class="modal-header"><span id="modal-titulo">Nueva admisión</span></div>
    <div class="modal-body form-modal-grid">
      <input type="hidden" id="f-id">
      <label class="span-full pac-typeahead-wrap">Paciente (cédula o nombre)
        <input type="hidden" id="m-paciente" value="">
        <input class="pac-typeahead-q" type="search" id="m-paciente-q" placeholder="Escribe cédula o nombre…" autocomplete="off">
        <div id="m-paciente-res" class="pac-suggest" hidden></div>
        <div id="m-paciente-chip" class="pac-chip" style="display:none"></div>
      </label>
      <label>Tipo de atención<select id="m-tipo">
        <option value="ambulatoria">Consulta ambulatoria (consultorio)</option>
        <option value="urgencia">Urgencias</option>
        <option value="hospitalizacion">Hospitalización</option>
      </select></label>
      <label>Vía de llegada<select id="m-via">
        <option value="propia">Por sus propios medios</option>
        <option value="ambulancia">Ambulancia</option>
        <option value="referido">Referido de otro centro</option>
      </select></label>
      <p class="span-full field-hint" id="m-flujo-hint">Ambulatoria es consulta de consultorio. Si llega en ambulancia, se atiende por Urgencias.</p>
      <label>Estado<select id="m-estado">
        <option value="activa">Activa</option>
        <option value="programada">Programada</option>
        <option value="alta">Alta</option>
        <option value="cancelada">Cancelada</option>
      </select></label>
      <label>Servicio<input id="m-servicio" value="Medicina interna"></label>
      <label class="span-full">Médico tratante
        <select id="m-medico" required></select>
      </label>
      <label>Fecha ingreso<input id="m-ingreso" type="date"></label>
      <label>Fecha egreso<input id="m-egreso" type="date"></label>
      <label class="span-full">Motivo<input id="m-motivo"></label>
      <label class="span-full">Notas<textarea id="m-notas" rows="2"></textarea></label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>
<script>
DiabCareNav.init();
DiabCareNav.guardRol(['administrador', 'farmaceutico', 'enfermero']);
const API = DiabCareNav.getApi();
let pag = 1;
let _totalRows = 0;
const LIMIT = (typeof DiabCareAPI !== 'undefined' && DiabCareAPI.GRID_PAGE_SIZE) || 12;
let _rows = [], _medicos = [];
let _pacTA = null;

function toast(msg, type='success') {
  if (typeof DiabCareAPI !== 'undefined' && DiabCareAPI.toast) {
    DiabCareAPI.toast(msg, type);
    return;
  }
  const t = document.getElementById('toast');
  document.getElementById('t-msg').textContent = msg;
  document.getElementById('t-icon').textContent = type === 'success' ? '✓' : '✗';
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function authHeaders(extra = {}) {
  // Cookie httpOnly; no confiar en Bearer "sesion"
  return { ...extra };
}

async function apiFetch(path, opts = {}) {
  const url = path.startsWith('http') ? path : `${API}${path}`;
  const headers = new Headers(authHeaders(opts.headers || {}));
  if (opts.body && !headers.has('Content-Type')) {
    headers.set('Content-Type', 'application/json');
  }
  return fetch(url, { ...opts, headers, credentials: 'include', cache: opts.cache || 'no-store' });
}

async function cargarMedicos() {
  const r = await apiFetch('/api/usuarios/medicos');
  if (r.ok) _medicos = (await r.json()).medicos || [];
}

async function cargarResumen() {
  const r = await apiFetch('/api/admisiones/resumen');
  if (!r.ok) return;
  const d = await r.json();
  document.getElementById('st-total').textContent = d.total ?? 0;
  document.getElementById('st-activas').textContent = d.activas ?? 0;
  document.getElementById('st-altas').textContent = d.altas ?? 0;
}

async function cargar() {
  const q = document.getElementById('f-q')?.value.trim() || '';
  const rel = DiabCareAPI.listUrlWithPage('/api/admisiones/', {
    page: pag, pageSize: LIMIT, q,
  });
  const r = await apiFetch(rel);
  if (r.status === 401) { window.location.href = '/'; return; }
  const data = await r.json();
  _rows = data.admisiones || [];
  _totalRows = Number(data.total) || 0;
  if (!_rows.length) {
    document.getElementById('tablaBody').innerHTML = q
      ? `<div class="loading">Sin coincidencias para “${q.replace(/[<>&]/g, '')}”</div>`
      : '<div class="loading">Sin admisiones registradas</div>';
    DiabCareAPI.renderPager(document.getElementById('dataPager'), {
      page: pag, pageSize: LIMIT, total: _totalRows,
      onPage: (p) => { pag = p; cargar(); },
    });
    return;
  }
  const body = document.getElementById('tablaBody');
  body.innerHTML = DiabCareAPI.buildDataGrid({
    rows: _rows,
    idField: 'id_admision',
    columns: [
      { key: 'paciente_nombre', label: 'Paciente', title: true },
      { key: 'estado', label: 'Estado', badge: true, render: a =>
        (typeof DiabCareAPI !== 'undefined' ? DiabCareAPI.capLabel(a.estado) : a.estado) || '—' },
      { key: 'tipo', label: 'Atención', render: a =>
        ({ ambulatoria: 'Consulta ambulatoria', urgencia: 'Urgencias', hospitalizacion: 'Hospitalización' }[a.tipo] || (typeof DiabCareAPI !== 'undefined' ? DiabCareAPI.capLabel(a.tipo) : a.tipo) || '—') },
      { key: 'via_llegada', label: 'Llegada', render: a =>
        ({ propia: 'Por sus medios', ambulancia: 'Ambulancia', referido: 'Referido' }[a.via_llegada] || '—') },
      { key: 'servicio', label: 'Servicio' },
      { key: 'fecha_ingreso', label: 'Ingreso' },
      { key: 'medico_nombre', label: 'Médico' },
    ],
    actionsHtml: (_a, id) =>
      `<button type="button" class="btn btn-ghost btn-sm" data-edit="${String(id).replace(/"/g, '&quot;')}">Editar</button>`,
  });
  body.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      editar(btn.getAttribute('data-edit'));
    };
  });
  DiabCareAPI.renderPager(document.getElementById('dataPager'), {
    page: pag, pageSize: LIMIT, total: _totalRows,
    onPage: (p) => { pag = p; cargar(); },
  });
}

function llenarMedicos(selected) {
  const sel = document.getElementById('m-medico');
  sel.innerHTML = _medicos.length
    ? _medicos.map(m => `<option value="${(m.nombre || '').replace(/"/g, '&quot;')}">${m.nombre || m.email}</option>`).join('')
    : '<option value="">- Registre un usuario con rol Médico -</option>';
  if (selected) {
    const match = [...sel.options].find(o => o.value === selected);
    sel.value = match ? selected : (sel.options[0]?.value || '');
  } else if (_medicos.length) sel.value = _medicos[0].nombre || '';
}

async function abrirModal(a) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modal-titulo').textContent = a ? 'Editar admisión' : 'Nueva admisión';
  document.getElementById('f-id').value = a?.id_admision ? String(a.id_admision) : '';
  if (!_pacTA) _pacTA = DiabCareAPI.mountPacienteTypeahead({ field: 'paciente' });
  if (a?.id_paciente) await _pacTA.setPaciente(String(a.id_paciente), a.paciente_nombre || '');
  else _pacTA.clear();
  document.getElementById('m-tipo').value = a?.tipo || 'ambulatoria';
  document.getElementById('m-via').value = a?.via_llegada || 'propia';
  document.getElementById('m-estado').value = a?.estado || 'activa';
  document.getElementById('m-servicio').value = a?.servicio || 'Medicina interna';
  llenarMedicos(a?.medico_nombre || '');
  document.getElementById('m-ingreso').value = (a?.fecha_ingreso || '').slice(0, 10);
  document.getElementById('m-egreso').value = (a?.fecha_egreso || '').slice(0, 10);
  document.getElementById('m-motivo').value = a?.motivo || '';
  document.getElementById('m-notas').value = a?.notas || '';
  if (!document.getElementById('m-ingreso').value) {
    document.getElementById('m-ingreso').value = new Date().toISOString().slice(0, 10);
  }
  if (!a?.id_paciente) setTimeout(() => document.getElementById('m-paciente-q').focus(), 50);
  actualizarFlujoHint();
}
function actualizarFlujoHint() {
  const hint = document.getElementById('m-flujo-hint');
  const via = document.getElementById('m-via')?.value;
  const tipo = document.getElementById('m-tipo');
  if (!hint || !tipo) return;
  if (via === 'ambulancia') {
    if (tipo.value === 'ambulatoria') tipo.value = 'urgencia';
    hint.textContent = 'Llegada en ambulancia: se atiende por Urgencias (aunque el caso sea grave). La vía y el tipo de atención no se excluyen: ambulancia + urgencias es el flujo correcto.';
  } else if (via === 'propia' && tipo.value === 'urgencia') {
    hint.textContent = 'Puede llegar por sus medios y aun así atenderse en Urgencias.';
  } else {
    hint.textContent = 'Ambulatoria = consulta de consultorio. Urgencias = atención no programada. Hospitalización = ingreso a cama.';
  }
}
function cerrarModal() { document.getElementById('modal').style.display = 'none'; }

function encontrarAdmision(id) {
  const sid = String(id || '');
  return _rows.find(x => String(x.id_admision || '') === sid);
}

async function editar(id) {
  const a = encontrarAdmision(id);
  if (!a) {
    toast('No se pudo abrir esa admisión. Recarga la lista.', 'error');
    return;
  }
  await abrirModal(a);
}

async function guardar() {
  const id = document.getElementById('f-id').value.trim();
  const body = {
    id_paciente: document.getElementById('m-paciente').value.trim(),
    tipo: document.getElementById('m-tipo').value,
    via_llegada: document.getElementById('m-via').value,
    estado: document.getElementById('m-estado').value,
    servicio: document.getElementById('m-servicio').value.trim(),
    medico_nombre: document.getElementById('m-medico').value.trim(),
    fecha_ingreso: document.getElementById('m-ingreso').value,
    fecha_egreso: document.getElementById('m-egreso').value,
    motivo: document.getElementById('m-motivo').value.trim(),
    notas: document.getElementById('m-notas').value.trim(),
  };
  if (!body.id_paciente) { toast('Busque y seleccione un paciente por cédula', 'error'); return; }
  if (!body.medico_nombre) { toast('Seleccione un médico', 'error'); return; }
  const errF = DiabCareAPI.rangoFechasOk(body.fecha_ingreso, body.fecha_egreso);
  if (errF) { toast(errF, 'error'); return; }
  const url = id ? `/api/admisiones/${encodeURIComponent(id)}` : '/api/admisiones/';
  const r = await apiFetch(url, {
    method: id ? 'PUT' : 'POST',
    body: JSON.stringify(body),
  });
  let d = {};
  try { d = await r.json(); } catch (_) { /* ignore */ }
  if (!r.ok) { toast(d.detail || d.error || 'Error al guardar', 'error'); return; }
  toast(id ? 'Admisión actualizada' : 'Admisión registrada');
  cerrarModal();
  await cargarResumen();
  await cargar();
}

cargarMedicos().then(() => {
  DiabCareAPI.bindLiveSearch({ input: document.getElementById('f-q'), onSearch: () => { pag = 1; return cargar(); } });
  DiabCareAPI.ligarRangoFechas('m-ingreso', 'm-egreso');
  document.getElementById('m-via')?.addEventListener('change', actualizarFlujoHint);
  document.getElementById('m-tipo')?.addEventListener('change', actualizarFlujoHint);
  cargarResumen();
  cargar();
});
</script>
</body>
</html>
