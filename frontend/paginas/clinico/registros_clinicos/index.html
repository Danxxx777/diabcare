<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare — Registros Clínicos</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="icon" href="/estaticos/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estaticos/estilos.css">
<link rel="stylesheet" href="/estaticos/dashboard.css">
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/navegacion.js"></script>
<script src="/estaticos/api.js"></script>
</head>
<body>

<aside class="sidebar" id="diabcare-sidebar"></aside>

<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Registros clínicos</span>
    <div class="tb-right"><div class="tb-online"><div class="tb-online-dot"></div><span class="tb-online-label">MinIO conectado</span></div></div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Registros <span>clínicos</span></div>
        <div class="page-sub">Consulta, filtra y gestiona registros clínicos</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Nuevo registro</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total registros</div><div class="stat-value blue" id="st-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Con diabetes</div><div class="stat-value red" id="st-con">—</div></div>
      <div class="stat-card"><div class="stat-label">Sin diabetes</div><div class="stat-value green" id="st-sin">—</div></div>
      <div class="stat-card"><div class="stat-label">Página actual</div><div class="stat-value" id="st-pag">1</div></div>
    </div>

    <div class="tabla-card">
      <div class="tabla-top">
        <span class="tabla-title">Registros</span>
        <select class="search" id="f-diabetes" style="width:160px" onchange="cargar()">
          <option value="">Todos</option>
          <option value="1">Con diabetes</option>
          <option value="0">Sin diabetes</option>
        </select>
        <select class="search" id="f-genero" style="width:130px" onchange="pag=1;cargar()">
          <option value="">Género</option>
          <option value="Femenino">Femenino</option>
          <option value="Masculino">Masculino</option>
          <option value="Otro">Otro</option>
        </select>
        <input class="search" id="f-paciente" placeholder="Buscar paciente…" style="width:150px" onkeydown="if(event.key==='Enter'){pag=1;cargar()}">
        <input class="search" id="f-ubicacion" placeholder="Ubicación" style="width:120px" onkeydown="if(event.key==='Enter'){pag=1;cargar()}">
        <input class="search" id="f-edad-min" type="number" placeholder="Edad min" style="width:90px" min="0">
        <input class="search" id="f-edad-max" type="number" placeholder="Edad max" style="width:90px" min="0">
        <button class="btn btn-primary btn-sm" onclick="pag=1;cargar()">Filtrar</button>
        <span class="tabla-info" id="info">—</span>
      </div>
      <div class="tabla-wrap">
        <div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando registros...</div></div>
      </div>
      <div style="padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="prevPag()">&#8592; Anterior</button>
        <span style="font-size:11px;color:var(--text3);font-family:var(--mono)" id="pagInfo">Pág 1</span>
        <button class="btn btn-ghost btn-sm" onclick="nextPag()">Siguiente &#8594;</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>

<div id="modal-reg" class="modal-overlay" style="display:none">
  <div class="modal-card modal-md">
    <div class="modal-header"><span id="modal-titulo">Nuevo registro</span></div>
    <div class="modal-body form-modal-grid">
      <input type="hidden" id="f-id">
      <label>Edad<input id="m-age" type="number" min="1" max="120"></label>
      <label>Género
        <select id="m-gender">
          <option>Femenino</option><option>Masculino</option><option>Otro</option>
        </select>
      </label>
      <label class="span-full">Ubicación<input id="m-location"></label>
      <label>BMI<input id="m-bmi" type="number" step="0.1"></label>
      <label>HbA1c<input id="m-hba" type="number" step="0.1"></label>
      <label>Glucosa<input id="m-glc" type="number"></label>
      <label>Diabetes
        <select id="m-diabetes"><option value="0">No</option><option value="1">Sí</option></select>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="guardarRegistro()">Guardar</button>
    </div>
  </div>
</div>

<script>
DiabCareNav.init();
const API = DiabCareNav.getApi();
const token = localStorage.getItem('token');
let pag = 1, totalPags = 1;
const LIMIT = 50;
let _rowsCache = [];

function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  document.getElementById('t-msg').textContent  = msg;
  document.getElementById('t-icon').textContent = type === 'success' ? '✓' : '✗';
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function cargar() {
  document.getElementById('tablaBody').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
  try {
    const diabetes = document.getElementById('f-diabetes').value;
    const genero   = document.getElementById('f-genero').value;
    const ubicacion = document.getElementById('f-ubicacion').value.trim();
    const paciente = document.getElementById('f-paciente').value.trim();
    const edadMin  = document.getElementById('f-edad-min').value;
    const edadMax  = document.getElementById('f-edad-max').value;
    let url = `${API}/api/registros/?offset=${(pag-1)*LIMIT}&limit=${LIMIT}`;
    if (diabetes !== '') url += `&diabetes=${diabetes}`;
    if (genero)          url += `&gender=${encodeURIComponent(genero)}`;
    if (ubicacion)       url += `&location=${encodeURIComponent(ubicacion)}`;
    if (paciente)        url += `&q=${encodeURIComponent(paciente)}`;
    if (edadMin)         url += `&age_min=${edadMin}`;
    if (edadMax)         url += `&age_max=${edadMax}`;

    const rData = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    if (rData.status === 401) { window.location.href = '/'; return; }
    if (rData.status === 403) { toast('Sin permiso para registros clínicos', 'error'); return; }
    const data = await rData.json();

    document.getElementById('st-total').textContent = (data.total || 0).toLocaleString('es-ES');
    document.getElementById('st-pag').textContent   = pag;
    totalPags = Math.max(1, Math.ceil((data.total || 0) / LIMIT));
    document.getElementById('pagInfo').textContent  = `Pág ${pag} / ${totalPags}`;
    document.getElementById('info').textContent     = `${(data.total||0).toLocaleString('es-ES')} coincidencias`;

    const rows = data.registros || [];
    _rowsCache = rows;
    if (!rows.length) {
      document.getElementById('tablaBody').innerHTML = '<div class="loading">Sin registros con esos filtros</div>';
      return;
    }
    let h = '<table class="tabla"><thead><tr><th>Paciente</th><th>Fecha</th><th>Edad</th><th>Género</th><th>Ubicación</th><th>BMI</th><th>HbA1c</th><th>Glucosa</th><th>Diabetes</th><th></th></tr></thead><tbody>';
    rows.forEach(r => {
      const fecha = (r.created_at || '').slice(0, 10) || '—';
      const pac = r.paciente_nombre || '—';
      h += `<tr>
        <td>${pac}</td><td>${fecha}</td><td>${r.age}</td><td>${r.gender||'—'}</td>
        <td>${(r.location||'—').substring(0,24)}</td><td>${r.bmi??'—'}</td>
        <td>${r.hbA1c_level??'—'}</td><td>${r.blood_glucose_level??'—'}</td>
        <td>${r.diabetes==1?'<span class="badge b-inactivo">Sí</span>':'<span class="badge b-activo">No</span>'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-ghost btn-sm" onclick="editarReg(${r.encounter_id})">Editar</button>
          <button class="btn btn-ghost btn-sm" onclick="eliminarReg(${r.encounter_id})">Eliminar</button>
        </td>
      </tr>`;
    });
    h += '</tbody></table>';
    document.getElementById('tablaBody').innerHTML = h;
  } catch {
    document.getElementById('tablaBody').innerHTML = '<div class="loading">Error de conexión</div>';
  }
}

async function cargarEstadisticas() {
  try {
    const r = await fetch(`${API}/api/registros/estadisticas`, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return;
    const stats = await r.json();
    document.getElementById('st-con').textContent = (stats.con_diabetes || 0).toLocaleString('es-ES');
    document.getElementById('st-sin').textContent = (stats.sin_diabetes || 0).toLocaleString('es-ES');
  } catch {}
}

function prevPag() { if (pag > 1) { pag--; cargar(); } }
function nextPag() { if (pag < totalPags) { pag++; cargar(); } }

function abrirModal(reg) {
  document.getElementById('modal-reg').style.display = 'flex';
  document.getElementById('modal-titulo').textContent = reg ? 'Editar registro' : 'Nuevo registro';
  document.getElementById('f-id').value = reg?.encounter_id || '';
  document.getElementById('m-age').value = reg?.age ?? 45;
  document.getElementById('m-gender').value = reg?.gender || 'Femenino';
  document.getElementById('m-location').value = reg?.location || 'California';
  document.getElementById('m-bmi').value = reg?.bmi ?? 28;
  document.getElementById('m-hba').value = reg?.hbA1c_level ?? 6.5;
  document.getElementById('m-glc').value = reg?.blood_glucose_level ?? 140;
  document.getElementById('m-diabetes').value = String(reg?.diabetes ?? 0);
}
function cerrarModal() { document.getElementById('modal-reg').style.display = 'none'; }
function editarReg(id) { abrirModal(_rowsCache.find(x => x.encounter_id === id)); }

async function guardarRegistro() {
  const id = document.getElementById('f-id').value;
  const body = {
    age: parseFloat(document.getElementById('m-age').value),
    gender: document.getElementById('m-gender').value,
    location: document.getElementById('m-location').value,
    bmi: parseFloat(document.getElementById('m-bmi').value),
    hbA1c_level: parseFloat(document.getElementById('m-hba').value),
    blood_glucose_level: parseInt(document.getElementById('m-glc').value, 10),
    diabetes: parseInt(document.getElementById('m-diabetes').value, 10),
    year: new Date().getFullYear(),
    hypertension: 0, heart_disease: 0, smoking_history: 'nunca',
  };
  const url = id ? `${API}/api/registros/${id}` : `${API}/api/registros/`;
  const method = id ? 'PUT' : 'POST';
  try {
    const r = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok || d.error) { toast(d.error || d.detail || 'Error', 'error'); return; }
    toast(id ? 'Registro actualizado' : 'Registro creado');
    cerrarModal(); cargar(); cargarEstadisticas();
  } catch { toast('Error de conexión', 'error'); }
}

async function eliminarReg(id) {
  const ok = await DiabCareAPI.confirm({
    title: 'Eliminar consulta',
    message: '¿Eliminar esta consulta? Esta acción no se puede deshacer.',
    confirmLabel: 'Eliminar',
    cancelLabel: 'Cancelar',
    danger: true,
  });
  if (!ok) return;
  try {
    const r = await fetch(`${API}/api/registros/${id}`, {
      method: 'DELETE', headers: { Authorization: 'Bearer ' + token },
    });
    const d = await r.json();
    if (!r.ok || d.error) { toast(d.error || 'Error', 'error'); return; }
    toast('Registro eliminado'); cargar(); cargarEstadisticas();
  } catch { toast('Error de conexión', 'error'); }
}

cargarEstadisticas();
cargar();
</script>
</body>
</html>
