<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare — Pacientes</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/estaticos/estilos.css">
<link rel="stylesheet" href="/estaticos/dashboard.css">
<style>
.paciente-thumb-btn {
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  border-radius: 50%;
  line-height: 0;
  transition: transform 0.15s, box-shadow 0.15s;
}
.paciente-thumb-btn:hover { transform: scale(1.08); box-shadow: 0 0 0 2px var(--cyan); }
.paciente-thumb-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.foto-lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(6px);
}
.foto-lightbox.open { display: flex; }
.foto-lightbox-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  max-width: min(92vw, 520px);
  width: 100%;
}
.foto-lightbox-frame {
  position: relative;
  width: 100%;
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
}
.foto-lightbox-frame img {
  display: block;
  width: 100%;
  max-height: min(70vh, 640px);
  object-fit: contain;
  border-radius: 6px;
}
.foto-lightbox-close {
  position: absolute;
  top: -14px;
  right: -14px;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: #fff;
  color: #111;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  z-index: 1;
}
.foto-lightbox-close:hover { background: #f0f0f0; }
.foto-lightbox-nombre {
  display: inline-block;
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.88);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  text-align: center;
  max-width: 100%;
}
.expediente-header {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.expediente-foto {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--border);
  flex-shrink: 0;
}
.expediente-meta h3 { margin: 0 0 4px; font-size: 18px; }
.expediente-meta p { margin: 0; font-size: 13px; color: var(--muted); }
.expediente-datos {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 16px;
  font-size: 13px;
  margin-bottom: 16px;
}
.expediente-datos span { color: var(--muted); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
.expediente-seccion { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 12px 0 8px; }
</style>
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/navegacion.js"></script>
<script src="/estaticos/api.js"></script>
</head>
<body>
<aside class="sidebar" id="diabcare-sidebar"></aside>
<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Pacientes</span>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Expedientes <span>clínicos</span></div>
        <div class="page-sub">Historia clínica del paciente (HCE)</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Nuevo paciente</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value blue" id="st-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Activos</div><div class="stat-value green" id="st-activos">—</div></div>
      <div class="stat-card"><div class="stat-label">Inactivos</div><div class="stat-value" id="st-inactivos">—</div></div>
    </div>
    <div class="tabla-card">
      <div class="tabla-top">
        <input class="search" id="f-q" placeholder="Buscar nombre o documento…" onkeydown="if(event.key==='Enter'){pag=1;cargar()}">
        <button class="btn btn-primary btn-sm" onclick="pag=1;cargar()">Buscar</button>
      </div>
      <div class="tabla-wrap"><div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando…</div></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>
<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal-card modal-md">
    <div class="modal-header"><span id="modal-titulo">Nuevo paciente</span></div>
    <div class="modal-body form-modal-grid">
      <input type="hidden" id="f-id">
      <label>Nombre<input id="m-nombre" required></label>
      <label>Apellido<input id="m-apellido"></label>
      <label>Documento<input id="m-documento"></label>
      <label>Edad<input id="m-edad" type="number" min="0" max="120"></label>
      <label>Género<select id="m-genero"><option>Femenino</option><option>Masculino</option><option>Otro</option></select></label>
      <label>Teléfono<input id="m-telefono"></label>
      <label>Email<input id="m-email" type="email"></label>
      <label class="span-full">Sede<input id="m-sede" value="Sede principal"></label>
      <label class="span-full">Notas<textarea id="m-notas" rows="2"></textarea></label>
      <label class="span-full">Foto del paciente
        <input type="file" id="m-foto" accept="image/jpeg,image/png,image/webp" onchange="previewFoto(this)">
      </label>
      <div class="span-full" id="foto-preview-wrap" style="display:none;text-align:center;">
        <img id="foto-preview" alt="Vista previa" style="max-width:120px;max-height:120px;border-radius:8px;border:1px solid var(--border);">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>
<div id="modal-expediente" class="modal-overlay" style="display:none">
  <div class="modal-card modal-lg">
    <div class="modal-header"><span>Expediente clínico (HCE)</span></div>
    <div class="modal-body">
      <div class="expediente-header">
        <img id="exp-foto" class="expediente-foto" alt="">
        <div class="expediente-meta">
          <h3 id="exp-nombre">—</h3>
          <p id="exp-codigo">—</p>
        </div>
      </div>
      <div class="expediente-datos" id="exp-datos"></div>
      <div class="expediente-seccion">Historial de consultas</div>
      <div id="exp-consultas"><div class="loading">Cargando consultas…</div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="cerrarExpediente()">Cerrar</button>
      <button class="btn btn-ghost btn-sm" onclick="editarDesdeExpediente()">Editar datos</button>
      <button class="btn btn-primary btn-sm" onclick="nuevaConsultaDesdeExpediente()">+ Nueva consulta</button>
    </div>
  </div>
</div>
<div id="foto-lightbox" class="foto-lightbox" role="dialog" aria-modal="true" aria-label="Foto del paciente">
  <div class="foto-lightbox-panel">
    <div class="foto-lightbox-frame">
      <button type="button" class="foto-lightbox-close" onclick="cerrarLightbox()" aria-label="Cerrar">&times;</button>
      <img id="foto-lightbox-img" alt="">
    </div>
    <div class="foto-lightbox-nombre" id="foto-lightbox-nombre"></div>
  </div>
</div>
<script>
DiabCareNav.init();
const API = DiabCareNav.getApi();
let pag = 1, _rows = [];
let _expedienteId = '';
const _fotoBust = {};
const _fotoLocal = {};

function authHdr(extra = {}) {
  const t = localStorage.getItem('token');
  return t ? { ...extra, Authorization: 'Bearer ' + t } : extra;
}

function urlFoto(id) {
  const t = encodeURIComponent(localStorage.getItem('token') || '');
  const v = _fotoBust[id] ? `&v=${_fotoBust[id]}` : '';
  return `${API}/api/pacientes/${id}/foto?token=${t}${v}`;
}

function srcFotoPaciente(p) {
  if (_fotoLocal[p.id_paciente]) return _fotoLocal[p.id_paciente];
  if (p.tiene_foto) return urlFoto(p.id_paciente);
  return '';
}

function pacienteTieneFoto(p) {
  return !!(p.tiene_foto || _fotoLocal[p.id_paciente]);
}

const THUMB_STYLE = 'width:36px;height:36px;object-fit:cover;border-radius:50%;background:var(--border);display:block;';
const THUMB_EMPTY = '<span style="width:36px;height:36px;display:inline-block;background:var(--border);border-radius:50%;"></span>';

function htmlThumb(p) {
  if (!pacienteTieneFoto(p)) return THUMB_EMPTY;
  const src = srcFotoPaciente(p);
  const id = p.id_paciente.replace(/'/g, "\\'");
  return `<button type="button" class="paciente-thumb-btn" onclick="verFoto('${id}')" title="Ver foto">
    <img src="${src}" alt="" style="${THUMB_STYLE}">
  </button>`;
}

function renderTabla() {
  if (!_rows.length) {
    document.getElementById('tablaBody').innerHTML = '<div class="loading">Sin pacientes</div>';
    return;
  }
  let h = '<table class="tabla"><thead><tr><th></th><th>Código</th><th>Paciente</th><th>Documento</th><th>Edad</th><th>Sede</th><th>Estado</th><th></th></tr></thead><tbody>';
  _rows.forEach(p => {
    h += `<tr data-pid="${p.id_paciente}">
      <td>${htmlThumb(p)}</td>
      <td>${p.codigo||'—'}</td>
      <td>${p.nombre_completo||p.nombre||'—'}</td>
      <td>${p.documento||'—'}</td>
      <td>${p.edad??'—'}</td>
      <td>${p.sede||'—'}</td>
      <td><span class="badge ${p.estado==='activo'?'b-activo':'b-inactivo'}">${p.estado||'—'}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-primary btn-sm" onclick="verExpediente('${p.id_paciente}')">Expediente</button>
        <button class="btn btn-ghost btn-sm" onclick="editar('${p.id_paciente}')">Editar</button>
        <button class="btn btn-ghost btn-sm" onclick="irPrediccion('${p.id_paciente}')">Predicción</button>
        <button class="btn btn-ghost btn-sm" onclick="baja('${p.id_paciente}')">Baja</button>
      </td></tr>`;
  });
  h += '</tbody></table>';
  document.getElementById('tablaBody').innerHTML = h;
}

function marcarFotoLocal(idPaciente, src) {
  _fotoBust[idPaciente] = Date.now();
  if (src) _fotoLocal[idPaciente] = src;
  const row = _rows.find(x => x.id_paciente === idPaciente);
  if (row) row.tiene_foto = true;
}

function actualizarFilaPaciente(idPaciente, cambios = {}) {
  const idx = _rows.findIndex(x => x.id_paciente === idPaciente);
  if (idx >= 0) {
    _rows[idx] = { ..._rows[idx], ...cambios };
  } else {
    _rows.unshift({ id_paciente: idPaciente, estado: 'activo', ...cambios });
  }
  renderTabla();
}

function verFoto(id) {
  const p = _rows.find(x => x.id_paciente === id);
  if (!p || !pacienteTieneFoto(p)) return;
  const src = srcFotoPaciente(p);
  if (!src) return;
  document.getElementById('foto-lightbox-img').src = src;
  document.getElementById('foto-lightbox-nombre').textContent =
    (p.nombre_completo || `${p.nombre || ''} ${p.apellido || ''}`).trim().toUpperCase() || 'PACIENTE';
  document.getElementById('foto-lightbox').classList.add('open');
}

function cerrarLightbox() {
  document.getElementById('foto-lightbox').classList.remove('open');
  document.getElementById('foto-lightbox-img').removeAttribute('src');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarLightbox();
});

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  document.getElementById('t-msg').textContent = msg;
  document.getElementById('t-icon').textContent = type === 'success' ? '✓' : '✗';
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function cargarResumen() {
  const r = await fetch(`${API}/api/pacientes/resumen`, { headers: authHdr() });
  if (!r.ok) return;
  const d = await r.json();
  document.getElementById('st-total').textContent = d.total ?? 0;
  document.getElementById('st-activos').textContent = d.activos ?? 0;
  document.getElementById('st-inactivos').textContent = d.inactivos ?? 0;
}

async function cargar() {
  const q = document.getElementById('f-q').value.trim();
  const url = `${API}/api/pacientes/?offset=${(pag-1)*50}&limit=50&q=${encodeURIComponent(q)}`;
  const r = await fetch(url, { headers: authHdr() });
  if (r.status === 401) { window.location.href = '/'; return; }
  const data = await r.json();
  _rows = data.pacientes || [];
  _rows.forEach(p => {
    if (pacienteTieneFoto(p) && !_fotoLocal[p.id_paciente]) {
      _fotoBust[p.id_paciente] = _fotoBust[p.id_paciente] || Date.now();
    }
  });
  renderTabla();
}

function previewFoto(input) {
  const wrap = document.getElementById('foto-preview-wrap');
  const img = document.getElementById('foto-preview');
  const f = input.files?.[0];
  if (!f) { wrap.style.display = 'none'; return; }
  img.src = URL.createObjectURL(f);
  wrap.style.display = 'block';
}

async function subirFoto(idPaciente) {
  const f = document.getElementById('m-foto').files?.[0];
  if (!f || !idPaciente) return { ok: true, subida: false };
  const preview = document.getElementById('foto-preview').src;
  const fd = new FormData();
  fd.append('archivo', f);
  const r = await fetch(`${API}/api/pacientes/${idPaciente}/foto`, {
    method: 'POST',
    headers: authHdr(),
    body: fd,
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    toast(d.detail || d.error || 'Error al subir foto', 'error');
    return { ok: false, subida: true };
  }
  marcarFotoLocal(idPaciente, preview.startsWith('blob:') ? preview : urlFoto(idPaciente));
  return { ok: true, subida: true, preview };
}

function abrirModal(p) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modal-titulo').textContent = p ? 'Editar paciente' : 'Nuevo paciente';
  document.getElementById('f-id').value = p?.id_paciente || '';
  document.getElementById('m-foto').value = '';
  document.getElementById('foto-preview-wrap').style.display = 'none';
  document.getElementById('m-nombre').value = p?.nombre || '';
  document.getElementById('m-apellido').value = p?.apellido || '';
  document.getElementById('m-documento').value = p?.documento || '';
  document.getElementById('m-edad').value = p?.edad ?? '';
  document.getElementById('m-genero').value = p?.genero || 'Femenino';
  document.getElementById('m-telefono').value = p?.telefono || '';
  document.getElementById('m-email').value = p?.email || '';
  document.getElementById('m-sede').value = p?.sede || 'Sede principal';
  document.getElementById('m-notas').value = p?.notas || '';
  if (p?.tiene_foto && p?.id_paciente) {
    document.getElementById('foto-preview-wrap').style.display = 'block';
    document.getElementById('foto-preview').src = srcFotoPaciente(p) || urlFoto(p.id_paciente);
  }
}
function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
function editar(id) { abrirModal(_rows.find(x => x.id_paciente === id)); }

function cerrarExpediente() {
  document.getElementById('modal-expediente').style.display = 'none';
  _expedienteId = '';
}

function renderExpedienteDatos(p) {
  const foto = document.getElementById('exp-foto');
  if (pacienteTieneFoto(p)) {
    foto.src = srcFotoPaciente(p) || urlFoto(p.id_paciente);
    foto.style.display = 'block';
  } else {
    foto.removeAttribute('src');
    foto.style.display = 'none';
  }
  document.getElementById('exp-nombre').textContent = p.nombre_completo || `${p.nombre || ''} ${p.apellido || ''}`.trim() || '—';
  document.getElementById('exp-codigo').textContent = `${p.codigo || '—'} · ${p.documento || 'Sin documento'} · ${p.estado || '—'}`;
  const campos = [
    ['Edad', p.edad ?? '—'],
    ['Género', p.genero || '—'],
    ['Teléfono', p.telefono || '—'],
    ['Email', p.email || '—'],
    ['Sede', p.sede || '—'],
    ['Notas', p.notas || '—'],
  ];
  document.getElementById('exp-datos').innerHTML = campos.map(([k, v]) =>
    `<div><span>${k}</span>${v}</div>`).join('');
}

async function cargarConsultasExpediente(id) {
  const box = document.getElementById('exp-consultas');
  box.innerHTML = '<div class="loading">Cargando consultas…</div>';
  const r = await fetch(`${API}/api/pacientes/${id}/consultas?limit=20`, { headers: authHdr() });
  if (!r.ok) {
    box.innerHTML = '<div class="loading">No se pudo cargar el historial</div>';
    return;
  }
  const data = await r.json();
  const rows = data.consultas || [];
  if (!rows.length) {
    box.innerHTML = '<div class="loading">Sin consultas registradas. Use «Nueva consulta» para documentar la atención.</div>';
    return;
  }
  let h = '<table class="tabla"><thead><tr><th>Fecha</th><th>HbA1c</th><th>Glucosa</th><th>IMC</th><th>Diabetes</th></tr></thead><tbody>';
  rows.forEach(c => {
    h += `<tr>
      <td>${c.fecha || c.encounter_date || '—'}</td>
      <td>${c.hba1c ?? c.HbA1c ?? '—'}</td>
      <td>${c.glucosa ?? c.glucose ?? '—'}</td>
      <td>${c.imc ?? c.bmi ?? '—'}</td>
      <td>${c.diabetes ?? '—'}</td>
    </tr>`;
  });
  h += '</tbody></table>';
  box.innerHTML = h;
}

async function verExpediente(id) {
  _expedienteId = id;
  let p = _rows.find(x => x.id_paciente === id);
  const r = await fetch(`${API}/api/pacientes/${id}`, { headers: authHdr() });
  if (r.ok) p = await r.json();
  if (!p) { toast('Paciente no encontrado', 'error'); return; }
  renderExpedienteDatos(p);
  document.getElementById('modal-expediente').style.display = 'flex';
  cargarConsultasExpediente(id);
}

function editarDesdeExpediente() {
  const id = _expedienteId;
  cerrarExpediente();
  if (id) editar(id);
}

function nuevaConsultaDesdeExpediente() {
  if (!_expedienteId) return;
  localStorage.setItem('diabcare_paciente_reg', _expedienteId);
  window.location.href = '/paginas/clinico/registros_clinicos/index.html';
}

async function guardar() {
  const id = document.getElementById('f-id').value;
  const body = {
    nombre: document.getElementById('m-nombre').value.trim(),
    apellido: document.getElementById('m-apellido').value.trim(),
    documento: document.getElementById('m-documento').value.trim(),
    edad: parseFloat(document.getElementById('m-edad').value) || 0,
    genero: document.getElementById('m-genero').value,
    telefono: document.getElementById('m-telefono').value.trim(),
    email: document.getElementById('m-email').value.trim(),
    sede: document.getElementById('m-sede').value.trim(),
    notas: document.getElementById('m-notas').value.trim(),
  };
  const url = id ? `${API}/api/pacientes/${id}` : `${API}/api/pacientes/`;
  const r = await fetch(url, {
    method: id ? 'PUT' : 'POST',
    headers: authHdr({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) { toast(d.detail || d.error || 'Error', 'error'); return; }
  const pid = id || d.id_paciente;
  const nombreCompleto = `${body.nombre} ${body.apellido}`.trim();
  const foto = await subirFoto(pid);

  actualizarFilaPaciente(pid, {
    codigo: id ? (_rows.find(x => x.id_paciente === pid)?.codigo || '—') : (d.codigo || '—'),
    nombre: body.nombre,
    apellido: body.apellido,
    nombre_completo: nombreCompleto,
    documento: body.documento,
    edad: body.edad,
    sede: body.sede,
    tiene_foto: (foto.ok && foto.subida) ? true : !!(_rows.find(x => x.id_paciente === pid)?.tiene_foto),
  });

  if (!foto.ok) {
    toast(id ? 'Paciente actualizado, pero la foto no se subió' : 'Paciente creado, pero la foto no se subió', 'error');
  } else {
    toast(id ? 'Paciente actualizado' : 'Paciente creado');
  }
  cerrarModal();
  cargarResumen();
  cargar();
}

function irPrediccion(id) {
  localStorage.setItem('diabcare_paciente_pred', id);
  window.location.href = '/paginas/clinico/prediccion/index.html';
}

async function baja(id) {
  if (!confirm('¿Desactivar este paciente?')) return;
  const r = await fetch(`${API}/api/pacientes/${id}`, { method: 'DELETE', headers: authHdr() });
  if (!r.ok) { toast('No se pudo desactivar', 'error'); return; }
  toast('Paciente desactivado');
  cargarResumen();
  cargar();
}

cargarResumen();
cargar();
</script>
</body>
</html>
