<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare — Corporativo</title>
<link rel="stylesheet" href="/estaticos/estilos.css">
<script src="/estaticos/navegacion.js"></script>
<style>
.corp-card { background:var(--card,var(--bg2)); border:1px solid var(--border); border-radius:10px; padding:24px; margin-bottom:14px; }
.corp-title { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted,var(--text3)); margin-bottom:12px; }
.corp-text { font-size:13px; color:var(--text); line-height:1.6; }
.corp-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.corp-list { margin:0; padding-left:18px; font-size:13px; line-height:1.7; color:var(--text); }
.corp-name { font-size:22px; font-weight:700; color:var(--text); margin-bottom:6px; }
</style>
</head>
<body>

<aside class="sidebar" id="diabcare-sidebar"></aside>

<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Corporativo</span>
    <div class="tb-right"><div class="tb-online"><div class="tb-online-dot"></div>MinIO conectado</div></div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Información <span>corporativa</span></div>
        <div class="page-sub">CU-O P9: misión, visión y objetivos institucionales (TA06)</div>
      </div>
    </div>

    <div class="corp-card">
      <div class="corp-name" id="c-nombre">—</div>
      <div class="corp-text" id="c-desc">—</div>
    </div>

    <div class="corp-grid">
      <div class="corp-card">
        <div class="corp-title">Misión</div>
        <div class="corp-text" id="c-mision">—</div>
      </div>
      <div class="corp-card">
        <div class="corp-title">Visión</div>
        <div class="corp-text" id="c-vision">—</div>
      </div>
    </div>

    <div class="corp-card">
      <div class="corp-title">Objetivos estratégicos</div>
      <ul class="corp-list" id="c-oe"></ul>
    </div>
    <div class="corp-card">
      <div class="corp-title">Objetivos tácticos</div>
      <ul class="corp-list" id="c-ot"></ul>
    </div>
    <div class="corp-card">
      <div class="corp-title">Objetivos operativos</div>
      <ul class="corp-list" id="c-oo"></ul>
    </div>
  </div>
</div>

<script>
DiabCareNav.init();
const API = 'http://localhost:8000';
const token = localStorage.getItem('token');

function toggle(h) { h.classList.toggle('open'); const s = h.nextElementSibling; if (s) s.classList.toggle('open'); }
function cerrarSesion() { localStorage.clear(); window.location.href = '/'; }

function initUser() {
  if (!token) { window.location.href = '/'; return; }
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  if (u.nombre) {
    document.getElementById('userName').textContent   = u.nombre;
    document.getElementById('userRol').textContent    = u.rol || '';
    document.getElementById('userAvatar').textContent = u.nombre[0].toUpperCase();
  }
}

function lista(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(t => `<li>${t}</li>`).join('');
}

async function cargar() {
  try {
    const r = await fetch(`${API}/api/corporativo/`, { headers: { 'Authorization': 'Bearer ' + token } });
    if (r.status === 401) { window.location.href = '/'; return; }
    const d = await r.json();
    document.getElementById('c-nombre').textContent = d.nombre || '—';
    document.getElementById('c-desc').textContent   = d.descripcion || '';
    document.getElementById('c-mision').textContent = d.mision || '';
    document.getElementById('c-vision').textContent = d.vision || '';
    lista('c-oe', d.objetivos_estrategicos);
    lista('c-ot', d.objetivos_tacticos);
    lista('c-oo', d.objetivos_operativos);
  } catch {}
}

cargar();
</script>
</body>
</html>
