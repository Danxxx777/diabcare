<!DOCTYPE html>

<head>

<title>DiabCare - Módulo</title>
<link rel="icon" href="/estaticos/img/favicon.ico">
<link rel="stylesheet" href="/estaticos/estilos.css?v=contrast-1">

<style>
.ph-card { max-width:560px; margin:40px auto; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; text-align:center; }
.ph-badge { display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--amber); border:1px solid var(--st-warning-line); background:var(--st-warning-line); padding:5px 12px; border-radius:999px; margin-bottom:14px; }
.ph-card h2 { font-size:22px; margin-bottom:10px; }
.ph-card p { color:var(--muted); font-size:13px; line-height:1.6; margin-bottom:16px; }
.ph-card ul { text-align:left; font-size:12px; color:var(--text2); margin:0 auto; max-width:360px; line-height:1.8; }
</style>
</head>
<body class="dc-uv">
<aside class="sidebar" id="diabcare-sidebar"></aside>
<div class="main">
  <div class="topbar"><span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page" id="ph-crumb">Módulo</span></div>
  <div class="content">
    <div class="ph-card">
      <div class="ph-badge" id="ph-fase">En desarrollo</div>
      <h2 id="ph-title">Módulo hospitalario</h2>
      <p id="ph-desc">Parte del HIS DiabCare Hospital.</p>
      <ul id="ph-funcs"></ul>
      <p style="margin-top:20px;font-size:11px;color:var(--muted)">Módulos activos: Admisiones - Pacientes - Diabetes - Consultas - Análisis</p>
      <a href="/paginas/clinico/analisis/index.html" class="btn btn-primary btn-sm" style="margin-top:16px;display:inline-flex">Ir al dashboard</a>
    </div>
  </div>
</div>
