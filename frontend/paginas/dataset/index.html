<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare — Dataset</title>
<link rel="stylesheet" href="/estaticos/estilos.css">
<script src="/estaticos/navegacion.js"></script>
</head>
<body>

<aside class="sidebar" id="diabcare-sidebar"></aside>

<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-crumb">Dataset</span><span class="tb-sep">/</span><span class="tb-page">Ver tablas</span>
    <div class="tb-right"><div class="tb-online"><div class="tb-online-dot"></div>MinIO conectado</div></div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Dataset <span>clínico</span></div>
        <div class="page-sub">Explora las tablas del dataset de diabetes hospitalaria</div>
      </div>
    </div>

    <div class="stats-grid" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-label">Fact diabetes</div><div class="stat-value blue" id="st-fact">—</div></div>
      <div class="stat-card"><div class="stat-label">Dim. paciente</div><div class="stat-value">23.601</div></div>
      <div class="stat-card"><div class="stat-label">Dim. ubicación</div><div class="stat-value">303</div></div>
      <div class="stat-card"><div class="stat-label">Dim. raza</div><div class="stat-value">31</div></div>
      <div class="stat-card"><div class="stat-label">Dim. condición</div><div class="stat-value">24</div></div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm tab-btn" data-tabla="hechos" onclick="selTabla(this)">Hechos diabetes</button>
      <button class="btn btn-ghost btn-sm tab-btn" data-tabla="paciente" onclick="selTabla(this)">Dim. paciente</button>
      <button class="btn btn-ghost btn-sm tab-btn" data-tabla="ubicacion" onclick="selTabla(this)">Dim. ubicación</button>
      <button class="btn btn-ghost btn-sm tab-btn" data-tabla="raza" onclick="selTabla(this)">Dim. raza</button>
      <button class="btn btn-ghost btn-sm tab-btn" data-tabla="condicion" onclick="selTabla(this)">Dim. condición</button>
    </div>

    <div class="tabla-card">
      <div class="tabla-top">
        <span class="tabla-title" id="tablaActual">Hechos diabetes</span>
        <button class="btn btn-ghost btn-sm" onclick="cargarTabla()">↺ Recargar</button>
        <span class="tabla-info" id="info">—</span>
      </div>
      <div class="tabla-wrap">
        <div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando tabla...</div></div>
      </div>
      <div style="padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="prevPag()">&#8592; Anterior</button>
        <span style="font-size:11px;color:var(--text3);font-family:var(--mono)" id="pagInfo">Pág 1</span>
        <button class="btn btn-ghost btn-sm" onclick="nextPag()">Siguiente &#8594;</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>

<script>
DiabCareNav.init();
const API = 'http://localhost:8000';
const token = localStorage.getItem('token');
let pag = 1, tablaActual = 'hechos';
const LIMIT = 50;

const RUTAS = {
  hechos:    '/api/dataset/hechos',
  paciente:  '/api/dataset/dimension/paciente',
  ubicacion: '/api/dataset/dimension/ubicacion',
  raza:      '/api/dataset/dimension/raza',
  condicion: '/api/dataset/dimension/condicion',
};

const NOMBRES = {
  hechos: 'Hechos diabetes', paciente: 'Dim. paciente',
  ubicacion: 'Dim. ubicación', raza: 'Dim. raza', condicion: 'Dim. condición'
};

function toggle(h) { h.classList.toggle('open'); const s = h.nextElementSibling; if (s) s.classList.toggle('open'); }

function initUser() {
  if (!localStorage.getItem('token')) { window.location.href = '/'; return; }
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  if (u.nombre) {
    document.getElementById('userName').textContent   = u.nombre;
    document.getElementById('userRol').textContent    = u.rol || '';
    document.getElementById('userAvatar').textContent = u.nombre[0].toUpperCase();
  }
  const rol = u.rol || '';
  const ACCESO = {
    'administrador': ['analisis','registros','dataset','usuarios','prediccion','pipeline','modelo','reportes','auditoria','notificaciones','configuracion','benchmarking','integraciones'],
    'medico':        ['analisis','registros','prediccion'],
    'analista':      ['analisis','dataset','prediccion'],
  };
  const permitidos = ACCESO[rol] || [];
  document.querySelectorAll('.nav-group').forEach(g => {
    const label = g.querySelector('.nav-group-label');
    if (!label) return;
    const texto = label.textContent.toLowerCase();
    const visible = permitidos.some(p => texto.includes(p === 'analisis' ? 'nál' : p === 'registros' ? 'egistro' : p === 'dataset' ? 'ataset' : p === 'usuarios' ? 'suario' : p === 'prediccion' ? 'redicci' : p === 'pipeline' ? 'ipeline' : p === 'modelo' ? 'odelo m' : p === 'reportes' ? 'eporte' : p === 'auditoria' ? 'uditor' : p === 'notificaciones' ? 'otificac' : p === 'configuracion' ? 'onfigur' : p === 'benchmarking' ? 'enchmark' : p === 'integraciones' ? 'ntegrac' : p));
    if (!visible) g.style.display = 'none';
  });
}

function cerrarSesion() { localStorage.clear(); window.location.href = '/'; }

function aplicarRoles() {
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  const rol = u.rol || '';
  const OCULTAR = {
    'medico':   ['Dataset','Usuarios','Pipeline ELT','Modelo ML','Reportes','Auditoría','Notificaciones','Configuración','Benchmarking','Integraciones'],
    'analista': ['Registros clínicos','Usuarios','Pipeline ELT','Modelo ML','Reportes','Auditoría','Notificaciones','Configuración','Benchmarking','Integraciones'],
  };
  const ocultar = OCULTAR[rol] || [];
  document.querySelectorAll('.nav-group').forEach(g => {
    const label = g.querySelector('.nav-group-label');
    if (!label) return;
    const txt = label.textContent.trim();
if (ocultar.some(o => txt.includes(o))) g.style.display = 'none';
  });
}

function selTabla(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => { b.className = 'btn btn-ghost btn-sm tab-btn'; });
  btn.className = 'btn btn-primary btn-sm tab-btn';
  tablaActual = btn.dataset.tabla;
  document.getElementById('tablaActual').textContent = NOMBRES[tablaActual];
  pag = 1;
  cargarTabla();
}

async function cargarTabla() {
  document.getElementById('tablaBody').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
  try {
    const url = `${API}${RUTAS[tablaActual]}?skip=${(pag-1)*LIMIT}&limit=${LIMIT}`;
    const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    if (r.status === 401) { window.location.href = '/'; return; }
    const data = await r.json();
    const rows = Array.isArray(data) ? data : (data.datos || data.items || data.registros || []);

    document.getElementById('info').textContent = rows.length + ' filas';
    document.getElementById('pagInfo').textContent = `Pág ${pag}`;

    if (!rows.length) { document.getElementById('tablaBody').innerHTML = '<div class="loading">Sin datos</div>'; return; }

    const cols = Object.keys(rows[0]);
    let h = `<table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
    rows.forEach(row => {
      h += `<tr>${cols.map(c => `<td class="mono">${row[c] ?? '—'}</td>`).join('')}</tr>`;
    });
    h += '</tbody></table>';
    document.getElementById('tablaBody').innerHTML = h;

    if (tablaActual === 'hechos' && data.total) {
  document.getElementById('st-fact').textContent = Number(data.total).toLocaleString('es-ES');
}
  } catch {
    document.getElementById('tablaBody').innerHTML = '<div class="loading">Error de conexión</div>';
  }
}

function prevPag() { if (pag > 1) { pag--; cargarTabla(); } }
function nextPag() { pag++; cargarTabla(); }

cargarTabla();
</script>
</body>
</html>
