<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare - Auditoría</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="icon" href="/estaticos/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estaticos/estilos.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/dashboard.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/animaciones.css?v=contrast-1">
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/i18n.js"></script>
<script src="/estaticos/navegacion.js?v=contrast-1"></script>
<script src="/estaticos/api.js"></script>
</head>
<body class="dc-uv">

<aside class="sidebar" id="diabcare-sidebar"></aside>

<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Auditoría</span>
    <div class="tb-right"><div class="tb-online"><div class="tb-online-dot"></div><span class="tb-online-label">MinIO conectado</span></div></div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Registro de <span>auditoría</span></div>
        <div class="page-sub">Historial de eventos y acciones del sistema</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="cargar()">↺ Recargar</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total eventos</div><div class="stat-value blue" id="st-total">-</div></div>
      <div class="stat-card"><div class="stat-label">Hoy</div><div class="stat-value" id="st-hoy">-</div></div>
      <div class="stat-card"><div class="stat-label">Errores</div><div class="stat-value red" id="st-errores">-</div></div>
      <div class="stat-card"><div class="stat-label">Usuarios activos</div><div class="stat-value green" id="st-users">-</div></div>
    </div>

    <div class="tabla-card">
      <div class="tabla-top">
        <span class="tabla-title">Eventos del sistema</span>
        <select class="search" id="f-tipo" style="width:140px" onchange="cargar()">
          <option value="">Todos los tipos</option>
          <option value="login">Login</option>
          <option value="logout">Logout</option>
          <option value="aprobacion">Aprobación</option>
          <option value="revoke">Revocar sesión</option>
          <option value="create">Creación</option>
          <option value="update">Actualización</option>
          <option value="delete">Eliminación</option>
          <option value="error">Error</option>
        </select>
        <input class="search" id="f-usuario" placeholder="Usuario..." style="width:140px" onkeydown="if(event.key==='Enter')cargar()">
        <select class="search" id="f-resultado" style="width:120px" onchange="cargar()">
          <option value="">Resultado</option>
          <option value="ok">ok</option>
          <option value="fallo">fallo</option>
        </select>
        <span class="tabla-info" id="info">-</span>
      </div>
      <div class="tabla-wrap">
        <div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando eventos...</div></div>
      </div>
      <div class="data-pager" id="dataPager">
        <button class="btn btn-ghost btn-sm" onclick="prevPag()">← Anterior</button>
        <span class="data-pager-info" id="pagInfo">Pág 1</span>
        <button class="btn btn-ghost btn-sm" onclick="nextPag()">Siguiente →</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>

<script>
DiabCareNav.init();
DiabCareNav.guardRol(['administrador']);
const API = DiabCareNav.getApi();
const token = localStorage.getItem('token');
let pag = 1;
const LIMIT = (typeof DiabCareAPI !== 'undefined' && DiabCareAPI.GRID_PAGE_SIZE) || 12;
let _totalRows = 0;

function toggle(h) { h.classList.toggle('open'); const s = h.nextElementSibling; if (s) s.classList.toggle('open'); }

function initUser() {
  if (!localStorage.getItem('token')) { window.location.href = '/'; return; }
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  if (u.rol !== 'administrador') { window.location.href = '/paginas/clinico/analisis/index.html'; return; }
  if (u.nombre) {
    document.getElementById('userName').textContent   = u.nombre;
    document.getElementById('userRol').textContent    = u.rol || '';
    document.getElementById('userAvatar').textContent = u.nombre[0].toUpperCase();
  }
}

function cerrarSesion() { localStorage.clear(); window.location.href = '/'; }

function aplicarRoles() {
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  const rol = u.rol || '';
  const OCULTAR = {
    'medico':   ['Dataset','Usuarios','Pipeline ELT','Modelo ML','Reportes','Auditoría','Notificaciones','Configuración','Benchmarking','Integraciones'],
    'analista': ['Registros clínicos','Usuarios','Pipeline ELT','Modelo ML','Reportes','Auditoría','Notificaciones','Configuración','Benchmarking','Integraciones'],
  };
  const ocultar = OCULTAR[rol] || [];
  document.querySelectorAll('.nav-group').forEach(g => {
    const label = g.querySelector('.nav-group-label');
    if (!label) return;
    const txt = label.textContent.trim();
if (ocultar.some(o => txt.includes(o))) g.style.display = 'none';
  });
}

async function cargar() {
  document.getElementById('tablaBody').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
  try {
    const tipo = document.getElementById('f-tipo').value;
    const usuario = document.getElementById('f-usuario').value.trim();
    const resultado = document.getElementById('f-resultado').value;
    let url = `${API}/api/auditoria/?skip=${(pag-1)*LIMIT}&limit=${LIMIT}`;
    if (tipo) url += `&tipo=${encodeURIComponent(tipo)}`;
    if (usuario) url += `&usuario=${encodeURIComponent(usuario)}`;
    if (resultado) url += `&resultado=${encodeURIComponent(resultado)}`;

    const hdr = { 'Authorization': 'Bearer ' + token };
    const [r, rs] = await Promise.all([
      fetch(url, { headers: hdr }),
      fetch(`${API}/api/auditoria/estadisticas`, { headers: hdr }),
    ]);
    if (r.status === 401) { window.location.href = '/'; return; }
    if (r.status === 403) { window.location.href = '/paginas/clinico/analisis/index.html'; return; }

    const data = await r.json();
    const eventos = Array.isArray(data) ? data : (data.eventos || data.items || []);
    _totalRows = data.total != null ? Number(data.total) : ((pag - 1) * LIMIT + eventos.length);
    const total = _totalRows;
    const totalPags = Math.max(1, Math.ceil(total / LIMIT) || 1);
    if (pag > totalPags && total > 0) { pag = totalPags; return cargar(); }

    if (rs.ok) {
      try {
        const st = await rs.json();
        document.getElementById('st-total').textContent = st.total ?? total;
        document.getElementById('st-hoy').textContent = st.hoy ?? '-';
        document.getElementById('st-errores').textContent = st.errores ?? '-';
        document.getElementById('st-users').textContent = st.usuarios ?? '-';
      } catch (_) { /* ignore */ }
    }

    document.getElementById('info').textContent = total + ' eventos';
    const from = total ? (pag - 1) * LIMIT + 1 : 0;
    const to = Math.min(pag * LIMIT, total);
    document.getElementById('pagInfo').textContent = total
      ? `${from}–${to} de ${total} · Pág ${pag} / ${totalPags}`
      : `Pág ${pag}`;
    const prevBtn = document.querySelector('#dataPager [onclick="prevPag()"]');
    const nextBtn = document.querySelector('#dataPager [onclick="nextPag()"]');
    if (prevBtn) prevBtn.disabled = pag <= 1;
    if (nextBtn) nextBtn.disabled = pag >= totalPags;

    if (!eventos.length) {
      document.getElementById('tablaBody').innerHTML = '<div class="loading">Sin eventos registrados</div>';
      return;
    }

    document.getElementById('tablaBody').innerHTML = DiabCareAPI.buildDataGrid({
      rows: eventos,
      showAvatar: false,
      columns: [
        {
          key: 'tipo', label: 'Tipo', title: true,
          render: e => e.tipo || e.modulo || e.endpoint || '—',
        },
        {
          key: 'resultado', label: 'Resultado', badge: true,
          render: e => e.resultado || 'ok',
        },
        {
          key: 'fecha', label: 'Fecha',
          render: e => (e.fecha || e.timestamp || e.creado_en || '—').replace('T', ' ').split('.')[0],
        },
        { key: 'usuario', label: 'Usuario', render: e => e.usuario || e.user_id || '—' },
        { key: 'modulo', label: 'Módulo', render: e => e.modulo || e.endpoint || '—' },
        { key: 'ip', label: 'IP', render: e => e.ip || '—' },
        {
          key: 'detalle', label: 'Detalle',
          render: e => e.detalle || e.descripcion || e.mensaje || '—',
        },
      ],
    });
  } catch {
    document.getElementById('tablaBody').innerHTML = '<div class="loading">Error de conexión</div>';
  }
}

function prevPag() { if (pag > 1) { pag--; cargar(); } }
function nextPag() {
  const pages = Math.max(1, Math.ceil(_totalRows / LIMIT) || 1);
  if (pag < pages) { pag++; cargar(); }
}

cargar();
</script>
</body>
</html>
