<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare — Registros Clínicos</title>
<link rel="stylesheet" href="/estaticos/estilos.css">
<script src="/estaticos/navegacion.js"></script>
</head>
<body>

<aside class="sidebar" id="diabcare-sidebar"></aside>

<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Registros clínicos</span>
    <div class="tb-right"><div class="tb-online"><div class="tb-online-dot"></div>MinIO conectado</div></div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Registros <span>clínicos</span></div>
        <div class="page-sub">Consulta y filtra los registros del sistema clínico</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total registros</div><div class="stat-value blue" id="st-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Con diabetes</div><div class="stat-value red" id="st-con">—</div></div>
      <div class="stat-card"><div class="stat-label">Sin diabetes</div><div class="stat-value green" id="st-sin">—</div></div>
      <div class="stat-card"><div class="stat-label">Página actual</div><div class="stat-value" id="st-pag">1</div></div>
    </div>

    <div class="tabla-card">
      <div class="tabla-top">
        <span class="tabla-title">Registros</span>
        <select class="search" id="f-diabetes" style="width:160px" onchange="cargar()">
          <option value="">Todos</option>
          <option value="1">Con diabetes</option>
          <option value="0">Sin diabetes</option>
        </select>
        <select class="search" id="f-genero" style="width:130px" onchange="pag=1;cargar()">
          <option value="">Género</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Other">Other</option>
        </select>
        <input class="search" id="f-ubicacion" placeholder="Ubicación" style="width:140px" onkeydown="if(event.key==='Enter'){pag=1;cargar()}">
        <input class="search" id="f-edad-min" type="number" placeholder="Edad min" style="width:90px" min="0">
        <input class="search" id="f-edad-max" type="number" placeholder="Edad max" style="width:90px" min="0">
        <button class="btn btn-primary btn-sm" onclick="pag=1;cargar()">Filtrar</button>
        <span class="tabla-info" id="info">—</span>
      </div>
      <div class="tabla-wrap">
        <div id="tablaBody"><div class="loading"><div class="spinner"></div>Cargando registros...</div></div>
      </div>
      <div style="padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="prevPag()">&#8592; Anterior</button>
        <span style="font-size:11px;color:var(--text3);font-family:var(--mono)" id="pagInfo">Pág 1</span>
        <button class="btn btn-ghost btn-sm" onclick="nextPag()">Siguiente &#8594;</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>

<script>
DiabCareNav.init();
const API = 'http://localhost:8000';
const token = localStorage.getItem('token');
let pag = 1, totalPags = 1;
const LIMIT = 50;

function toggle(h) { h.classList.toggle('open'); const s = h.nextElementSibling; if (s) s.classList.toggle('open'); }

function initUser() {
  if (!localStorage.getItem('token')) { window.location.href = '/'; return; }
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  if (u.nombre) {
    document.getElementById('userName').textContent   = u.nombre;
    document.getElementById('userRol').textContent    = u.rol || '';
    document.getElementById('userAvatar').textContent = u.nombre[0].toUpperCase();
  }
  const rol = u.rol || '';
  const ACCESO = {
    'administrador': ['analisis','registros','dataset','usuarios','prediccion','pipeline','modelo','reportes','auditoria','notificaciones','configuracion','benchmarking','integraciones'],
    'medico':        ['analisis','registros','prediccion'],
    'analista':      ['analisis','dataset','prediccion'],
  };
  const permitidos = ACCESO[rol] || [];
  document.querySelectorAll('.nav-group').forEach(g => {
    const label = g.querySelector('.nav-group-label');
    if (!label) return;
    const texto = label.textContent.toLowerCase();
    const visible = permitidos.some(p => texto.includes(p === 'analisis' ? 'nál' : p === 'registros' ? 'egistro' : p === 'dataset' ? 'ataset' : p === 'usuarios' ? 'suario' : p === 'prediccion' ? 'redicci' : p === 'pipeline' ? 'ipeline' : p === 'modelo' ? 'odelo m' : p === 'reportes' ? 'eporte' : p === 'auditoria' ? 'uditor' : p === 'notificaciones' ? 'otificac' : p === 'configuracion' ? 'onfigur' : p === 'benchmarking' ? 'enchmark' : p === 'integraciones' ? 'ntegrac' : p));
    if (!visible) g.style.display = 'none';
  });
}

function cerrarSesion() { localStorage.clear(); window.location.href = '/'; }

function aplicarRoles() {
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  const rol = u.rol || '';
  const OCULTAR = {
    'medico':   ['Dataset','Usuarios','Pipeline ELT','Modelo ML','Reportes','Auditoría','Notificaciones','Configuración','Benchmarking','Integraciones'],
    'analista': ['Registros clínicos','Usuarios','Pipeline ELT','Modelo ML','Reportes','Auditoría','Notificaciones','Configuración','Benchmarking','Integraciones'],
  };
  const ocultar = OCULTAR[rol] || [];
  document.querySelectorAll('.nav-group').forEach(g => {
    const label = g.querySelector('.nav-group-label');
    if (!label) return;
    const txt = label.textContent.trim();
if (ocultar.some(o => txt.includes(o))) g.style.display = 'none';
  });
}

function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  document.getElementById('t-msg').textContent  = msg;
  document.getElementById('t-icon').textContent = type === 'success' ? '✓' : '✗';
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function cargar() {
  document.getElementById('tablaBody').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
  try {
    const diabetes = document.getElementById('f-diabetes').value;
    const genero   = document.getElementById('f-genero').value;
    const ubicacion = document.getElementById('f-ubicacion').value.trim();
    const edadMin  = document.getElementById('f-edad-min').value;
    const edadMax  = document.getElementById('f-edad-max').value;
    let url = `${API}/api/registros/?offset=${(pag-1)*LIMIT}&limit=${LIMIT}`;
    if (diabetes !== '') url += `&diabetes=${diabetes}`;
    if (genero)          url += `&gender=${encodeURIComponent(genero)}`;
    if (ubicacion)       url += `&location=${encodeURIComponent(ubicacion)}`;
    if (edadMin)         url += `&age_min=${edadMin}`;
    if (edadMax)         url += `&age_max=${edadMax}`;

    const rData = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    if (rData.status === 401) { window.location.href = '/'; return; }
    if (rData.status === 403) { toast('Sin permiso para registros clínicos', 'error'); return; }
    const data = await rData.json();

    document.getElementById('st-total').textContent = (data.total || 0).toLocaleString('es-ES');
    document.getElementById('st-pag').textContent   = pag;
    totalPags = Math.max(1, Math.ceil((data.total || 0) / LIMIT));
    document.getElementById('pagInfo').textContent  = `Pág ${pag} / ${totalPags}`;
    document.getElementById('info').textContent     = `${(data.total||0).toLocaleString('es-ES')} coincidencias`;

    const rows = data.registros || [];
    if (!rows.length) {
      document.getElementById('tablaBody').innerHTML = '<div class="loading">Sin registros con esos filtros</div>';
      return;
    }
    let h = '<table class="tabla"><thead><tr><th>ID</th><th>Edad</th><th>Género</th><th>Ubicación</th><th>BMI</th><th>HbA1c</th><th>Glucosa</th><th>Diabetes</th></tr></thead><tbody>';
    rows.forEach(r => {
      h += `<tr>
        <td>${r.encounter_id}</td><td>${r.age}</td><td>${r.gender||'—'}</td>
        <td>${(r.location||'—').substring(0,24)}</td><td>${r.bmi??'—'}</td>
        <td>${r.hbA1c_level??'—'}</td><td>${r.blood_glucose_level??'—'}</td>
        <td>${r.diabetes==1?'<span class="badge b-inactivo">Sí</span>':'<span class="badge b-activo">No</span>'}</td>
      </tr>`;
    });
    h += '</tbody></table>';
    document.getElementById('tablaBody').innerHTML = h;
  } catch {
    document.getElementById('tablaBody').innerHTML = '<div class="loading">Error de conexión</div>';
  }
}

async function cargarEstadisticas() {
  try {
    const r = await fetch(`${API}/api/registros/estadisticas`, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return;
    const stats = await r.json();
    document.getElementById('st-con').textContent = (stats.con_diabetes || 0).toLocaleString('es-ES');
    document.getElementById('st-sin').textContent = (stats.sin_diabetes || 0).toLocaleString('es-ES');
  } catch {}
}

function prevPag() { if (pag > 1) { pag--; cargar(); } }
function nextPag() { if (pag < totalPags) { pag++; cargar(); } }

cargarEstadisticas();
cargar();
</script>
</body>
</html>
