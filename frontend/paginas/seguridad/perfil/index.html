<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare — Mi perfil</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="icon" href="/estaticos/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estaticos/estilos.css">
<link rel="stylesheet" href="/estaticos/dashboard.css">
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/navegacion.js"></script>
<script src="/estaticos/api.js"></script>
<style>
.perfil-header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 20px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
}
.perfil-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(34,211,238,0.12);
  border: 1px solid rgba(34,211,238,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--cyan);
  flex-shrink: 0;
}
.perfil-meta h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
.perfil-meta p { font-size: 12px; color: var(--text3); font-family: var(--mono); margin: 0; }
.perfil-rol {
  display: inline-block;
  margin-top: 8px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(34,211,238,0.1);
  color: var(--cyan);
  border: 1px solid rgba(34,211,238,0.2);
}
.config-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.config-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.config-sub { font-size: 11px; color: var(--text3); margin-bottom: 16px; }
.config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 720px) { .config-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<aside class="sidebar" id="diabcare-sidebar"></aside>

<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Mi perfil</span>
    <div class="tb-right"><div class="tb-online"><div class="tb-online-dot"></div><span class="tb-online-label">MinIO conectado</span></div></div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Mi <span>perfil</span></div>
        <div class="page-sub">Datos personales y seguridad de tu cuenta</div>
      </div>
      <button class="btn btn-primary" onclick="guardarPerfil()">Guardar cambios</button>
    </div>

    <div class="perfil-header">
      <div class="perfil-avatar" id="p-avatar">?</div>
      <div class="perfil-meta">
        <h2 id="p-nombre-display">—</h2>
        <p id="p-email-display">—</p>
        <span class="perfil-rol" id="p-rol-display">—</span>
      </div>
    </div>

    <div class="config-section">
      <div class="config-title">Información personal</div>
      <div class="config-sub">El correo y el rol los gestiona un administrador</div>
      <div class="config-grid">
        <div class="fg">
          <label class="fl">Nombre completo</label>
          <input class="fi" id="p-nombre" autocomplete="name" placeholder="Tu nombre">
        </div>
        <div class="fg">
          <label class="fl">Correo electrónico</label>
          <input class="fi" id="p-email" type="email" disabled>
        </div>
      </div>
    </div>

    <div class="config-section">
      <div class="config-title">Seguridad</div>
      <div class="config-sub">Cambia tu contraseña de acceso al sistema</div>
      <div class="config-grid">
        <div class="fg">
          <label class="fl">Contraseña actual</label>
          <input class="fi" id="p-pass-actual" type="password" autocomplete="current-password">
        </div>
        <div class="fg">
          <label class="fl">Nueva contraseña</label>
          <input class="fi" id="p-pass-nueva" type="password" autocomplete="new-password">
        </div>
      </div>
      <div style="margin-top:12px;">
        <button type="button" class="btn btn-ghost btn-sm" onclick="cambiarPassword()">Actualizar contraseña</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>

<script>
DiabCareNav.init();
const API = DiabCareNav.getApi();
const token = localStorage.getItem('token');

function toast(msg, type = 'success') {
  if (typeof DiabCareAPI !== 'undefined') {
    DiabCareAPI.toast(msg, type);
    return;
  }
  const t = document.getElementById('toast');
  document.getElementById('t-msg').textContent = msg;
  document.getElementById('t-icon').textContent = type === 'success' ? '✓' : '✗';
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function authHdr() {
  return { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
}

function pintarPerfil(u) {
  const nombre = u.nombre || 'Usuario';
  document.getElementById('p-avatar').textContent = nombre[0].toUpperCase();
  document.getElementById('p-nombre-display').textContent = nombre;
  document.getElementById('p-email-display').textContent = u.email || '—';
  document.getElementById('p-rol-display').textContent = u.rol || '—';
  document.getElementById('p-nombre').value = nombre;
  document.getElementById('p-email').value = u.email || '';
}

function actualizarLocal(u) {
  const prev = JSON.parse(localStorage.getItem('usuario') || '{}');
  const merged = { ...prev, ...u };
  localStorage.setItem('usuario', JSON.stringify(merged));
  DiabCareNav.initUser();
}

async function cargarPerfil() {
  if (!token) { window.location.href = '/'; return; }
  try {
    const r = await fetch(`${API}/api/auth/perfil`, { headers: authHdr() });
    if (r.status === 401) { window.location.href = '/'; return; }
    const u = await r.json();
    if (u.detail) { toast(u.detail, 'error'); return; }
    pintarPerfil(u);
  } catch {
    const u = JSON.parse(localStorage.getItem('usuario') || '{}');
    if (u.nombre) pintarPerfil(u);
  }
}

async function guardarPerfil() {
  const nombre = document.getElementById('p-nombre').value.trim();
  if (nombre.length < 2) { toast('El nombre debe tener al menos 2 caracteres', 'error'); return; }
  try {
    const r = await fetch(`${API}/api/auth/perfil`, {
      method: 'PUT',
      headers: authHdr(),
      body: JSON.stringify({ nombre })
    });
    const d = await r.json();
    if (!r.ok) { toast(d.detail || 'Error al guardar', 'error'); return; }
    if (d.usuario) {
      pintarPerfil(d.usuario);
      actualizarLocal(d.usuario);
    }
    toast('Perfil actualizado');
  } catch {
    toast('Error de conexión', 'error');
  }
}

async function cambiarPassword() {
  const password_actual = document.getElementById('p-pass-actual').value;
  const password_nueva = document.getElementById('p-pass-nueva').value;
  if (!password_actual || !password_nueva) {
    toast('Completa contraseña actual y nueva', 'error');
    return;
  }
  if (password_nueva.length < 6) {
    toast('La nueva contraseña debe tener al menos 6 caracteres', 'error');
    return;
  }
  try {
    const r = await fetch(`${API}/api/auth/cambiar-password`, {
      method: 'PUT',
      headers: authHdr(),
      body: JSON.stringify({ password_actual, password_nueva })
    });
    const d = await r.json();
    if (!r.ok) { toast(d.detail || 'Error al cambiar contraseña', 'error'); return; }
    document.getElementById('p-pass-actual').value = '';
    document.getElementById('p-pass-nueva').value = '';
    toast('Contraseña actualizada');
  } catch {
    toast('Error de conexión', 'error');
  }
}

cargarPerfil();
</script>
</body>
</html>
