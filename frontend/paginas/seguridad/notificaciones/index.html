<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare - Notificaciones</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="icon" href="/estaticos/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estaticos/estilos.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/dashboard.css?v=contrast-1">
<link rel="stylesheet" href="/estaticos/animaciones.css?v=contrast-1">
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/i18n.js?v=text-36"></script>
<script src="/estaticos/navegacion.js?v=text-36"></script>
<script src="/estaticos/api.js?v=text-36"></script>
<style>
.badge-tipo { font-size:10px; padding:2px 8px; border-radius:999px; font-family:var(--mono); text-transform:uppercase; }
.badge-warning { background:var(--st-warning-bg); color:var(--dc-alerta); }
.badge-error, .badge-critico { background:var(--st-critical-bg); color:var(--dc-riesgo); }
.badge-success, .badge-info { background:var(--ia-subtle); color:var(--cyan); }
.badge-rol {
  font-size:10px; padding:2px 8px; border-radius:999px;
  background:var(--ia-subtle); color:var(--accent2);
  font-weight:600; white-space:nowrap;
}
.notif-row { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start; }
.notif-row.unread { background:var(--ia-subtle); }
.notif-row:last-child { border-bottom:none; }
.notif-body { flex:1; min-width:0; }
.notif-title { font-size:13px; font-weight:600; margin-bottom:4px; }
.notif-msg { font-size:12px; color:var(--text2); line-height:1.45; }
.notif-meta { font-size:10px; color:var(--text3); font-family:var(--mono); margin-top:6px; }
.notif-rol-banner {
  margin-bottom:14px; padding:10px 14px; border-radius:10px;
  border:1px solid var(--ia-subtle); background:var(--ia-subtle);
  font-size:12px; color:var(--text2);
}
.notif-rol-banner strong { color:var(--cyan); }
.notif-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--border)}
.notif-tools .search{flex:1;min-width:220px}.notif-filter.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.notif-action{margin-top:8px;display:inline-flex}.notif-empty{padding:34px 18px;text-align:center;color:var(--text3)}
</style>
</head>
<body class="dc-uv">

<aside class="sidebar" id="diabcare-sidebar"></aside>

<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Notificaciones</span>
    <div class="tb-right"><div class="tb-online"><div class="tb-online-dot"></div><span class="tb-online-label">Alertas clínicas</span></div></div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Alertas y <span>notificaciones</span></div>
        <div class="page-sub" id="page-sub-notif">Avisos filtrados por tu rol - correo (Brevo)</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="evaluar()">⚡ Evaluar umbrales</button>
        <button class="btn btn-ghost btn-sm" onclick="marcarTodas()">✓ Marcar todas leídas</button>
        <button class="btn btn-ghost btn-sm" onclick="vaciarLeidas()">🗑 Vaciar leídas</button>
        <button class="btn btn-ghost btn-sm" onclick="cargar()">↺ Recargar</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value blue" id="st-total">-</div></div>
      <div class="stat-card"><div class="stat-label">No leídas</div><div class="stat-value" id="st-unread">-</div></div>
      <div class="stat-card"><div class="stat-label">Hoy</div><div class="stat-value green" id="st-hoy">-</div></div>
      <div class="stat-card"><div class="stat-label">Emails enviados</div><div class="stat-value" id="st-mail">-</div></div>
    </div>

    <div class="notif-rol-banner" id="rol-banner">Cargando bandeja por rol…</div>

    <div class="tabla-card">
      <div class="tabla-top">
        <span class="tabla-title" id="tabla-title-notif">Bandeja de notificaciones</span>
        <label style="font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="f-solo" onchange="cargar()"> Solo no leídas
        </label>
        <span class="tabla-info" id="info">-</span>
      </div>
      <div class="notif-tools">
        <input class="search" id="f-buscar" type="search" placeholder="Buscar por título, mensaje o referencia..." oninput="renderNotificaciones()">
        <button class="btn btn-ghost btn-sm notif-filter active" data-tipo="" onclick="filtrarTipo(this)">Todas</button>
        <button class="btn btn-ghost btn-sm notif-filter" data-tipo="critico" onclick="filtrarTipo(this)">Críticas</button>
        <button class="btn btn-ghost btn-sm notif-filter" data-tipo="warning" onclick="filtrarTipo(this)">Advertencias</button>
        <button class="btn btn-ghost btn-sm notif-filter" data-tipo="info" onclick="filtrarTipo(this)">Informativas</button>
      </div>
      <div id="lista"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>

<script>
DiabCareNav.init();
DiabCareNav.guardRol(['administrador', 'medico', 'analista', 'enfermero', 'farmaceutico']);
const API = DiabCareNav.getApi();
const token = (DiabCareNav.haySesionLocal && DiabCareNav.haySesionLocal()) ? 'sesion' : '';
const _usuario = JSON.parse(localStorage.getItem('usuario') || sessionStorage.getItem('usuario') || '{}');
const _rolLabel = DiabCareNav.etiquetaRol(_usuario.rol);
let notificaciones = [];
let filtroTipo = '';

(function pintarBannerRol() {
  const ban = document.getElementById('rol-banner');
  if (ban) {
    ban.innerHTML = `Solo ves avisos del rol <strong>${_rolLabel}</strong>. `
      + `Si otro rol completa una acción (p. ej. cobro de cita), tú recibes el aviso correspondiente.`;
  }
  const tit = document.getElementById('tabla-title-notif');
  if (tit) tit.textContent = `Bandeja - ${_rolLabel}`;
  const sub = document.getElementById('page-sub-notif');
  if (sub) sub.textContent = `Filtrado para ${_rolLabel} - alertas clínicas y correo (Brevo)`;
})();

function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  document.getElementById('t-msg').textContent = msg;
  document.getElementById('t-icon').textContent = type === 'success' ? '✓' : '✗';
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function badgeTipo(tipo) {
  const t = (tipo || 'info').toLowerCase();
  const cls = ['warning','error','critico','success'].includes(t) ? t : 'info';
  return `<span class="badge-tipo badge-${cls}">${t}</span>`;
}

function badgeRolNotif(n) {
  const lab = n.destinatario_label || DiabCareNav.etiquetaRol(n.destinatario) || '-';
  return `<span class="badge-rol">${lab}</span>`;
}

async function pintarStatsDesdeLista(d) {
  document.getElementById('st-total').textContent = d.total ?? 0;
  document.getElementById('st-unread').textContent = d.no_leidas ?? 0;
}

async function cargarStats() {
  try {
    const r = await fetch(`${API}/api/notificaciones/estadisticas`, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('st-total').textContent = d.total ?? 0;
    document.getElementById('st-unread').textContent = d.no_leidas ?? 0;
    document.getElementById('st-hoy').textContent = d.alertas_hoy ?? 0;
    document.getElementById('st-mail').textContent = d.emails_enviados ?? 0;
  } catch (e) { console.error(e); }
}

async function cargar() {
  const solo = document.getElementById('f-solo').checked;
  const lista = document.getElementById('lista');
  lista.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
  try {
    const r = await fetch(`${API}/api/notificaciones/?limit=100&solo_no_leidas=${solo}`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Error');
    document.getElementById('info').textContent = `${d.total} notificación(es)`;
    pintarStatsDesdeLista(d);
    notificaciones = d.notificaciones || [];
    renderNotificaciones();
  } catch (e) {
    lista.innerHTML = `<div style="padding:16px;color:var(--red);">${e.message}</div>`;
  }
}

function rutaReferencia(n) {
  const rutas = {
    cita: '/paginas/clinico/agenda/index.html', factura: '/paginas/negocio/facturacion/index.html',
    receta: '/paginas/negocio/farmacia/index.html', laboratorio: '/paginas/clinico/laboratorio/index.html',
    paciente: '/paginas/clinico/pacientes/index.html', dataset: '/paginas/datos/dataset/index.html',
  };
  return rutas[String(n.referencia_tipo || '').toLowerCase()] || '';
}
function renderNotificaciones() {
  const lista = document.getElementById('lista');
  const q = (document.getElementById('f-buscar')?.value || '').trim().toLowerCase();
  const filas = notificaciones.filter(n => {
    const tipo = String(n.tipo || 'info').toLowerCase();
    const coincideTipo = !filtroTipo || tipo === filtroTipo || (filtroTipo === 'critico' && ['error','critico'].includes(tipo));
    const texto = `${n.titulo || ''} ${n.mensaje || ''} ${n.referencia_tipo || ''} ${n.referencia_id || ''}`.toLowerCase();
    return coincideTipo && (!q || texto.includes(q));
  });
  if (!filas.length) {
    lista.innerHTML = '<div class="notif-empty">No hay avisos que coincidan con este filtro.</div>';
    return;
  }
  lista.innerHTML = filas.map(n => {
    const ruta = rutaReferencia(n);
    return `
      <div class="notif-row ${n.leida ? '' : 'unread'}" data-id="${n.id}">
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
          ${badgeTipo(n.tipo)}
          ${badgeRolNotif(n)}
        </div>
        <div class="notif-body">
          <div class="notif-title">${n.titulo || '-'}</div>
          <div class="notif-msg">${n.mensaje || ''}</div>
          <div class="notif-meta">Para: ${n.destinatario_label || DiabCareNav.etiquetaRol(n.destinatario) || '-'} - ${(n.creado_en || '').replace('T',' ').slice(0,19)}${n.email_enviado ? ' - ✉ enviado' : ''}</div>
          ${ruta ? `<a class="btn btn-ghost btn-sm notif-action" href="${ruta}">Abrir ${n.referencia_tipo}</a>` : ''}
        </div>
        ${n.leida ? '' : `<button class="btn btn-ghost btn-sm" onclick="marcar('${n.id}')">Leída</button>`}
      </div>`;
  }).join('');
}
function filtrarTipo(btn) {
  filtroTipo = btn.dataset.tipo || '';
  document.querySelectorAll('.notif-filter').forEach(b => b.classList.toggle('active', b === btn));
  renderNotificaciones();
}

async function marcar(id) {
  await fetch(`${API}/api/notificaciones/${id}/leida`, {
    method: 'PATCH', headers: { Authorization: 'Bearer ' + token }
  });
  cargar();
}

async function vaciarLeidas() {
  if (!confirm('Se eliminarán las notificaciones ya leídas. Las no leídas se conservan. ¿Continuar?')) return;
  const r = await fetch(`${API}/api/notificaciones/leidas`, {
    method: 'DELETE', headers: { Authorization: 'Bearer ' + token }, credentials: 'include'
  });
  const d = await r.json().catch(() => ({}));
  toast(d.mensaje || 'Bandeja depurada', r.ok ? 'success' : 'error');
  cargar();
}

async function marcarTodas() {
  await fetch(`${API}/api/notificaciones/leer-todas`, {
    method: 'POST', headers: { Authorization: 'Bearer ' + token }
  });
  toast('Todas marcadas como leídas');
  cargar();
}

async function evaluar() {
  try {
    const r = await fetch(`${API}/api/notificaciones/evaluar`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token }
    });
    const d = await r.json();
    toast(`Evaluados ${d.evaluadas || 0} registros - ${d.alertas_nuevas || 0} alertas nuevas`);
    cargar();
  } catch {
    toast('Error al evaluar', 'error');
  }
}

if (!token) {
  if (DiabCareNav.forzarCierreSesion) DiabCareNav.forzarCierreSesion('Inicia sesión para continuar.');
  else window.location.href = '/';
} else {
  cargar();
  cargarStats();
}
</script>
</body>
</html>
