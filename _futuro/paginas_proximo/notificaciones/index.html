<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiabCare — Notificaciones</title>
<link rel="icon" href="/estaticos/img/favicon.ico" sizes="32x32">
<link rel="icon" href="/estaticos/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estaticos/estilos.css">
<link rel="stylesheet" href="/estaticos/dashboard.css">
<script src="/estaticos/iconos.js"></script>
<script src="/estaticos/navegacion.js"></script>
<script src="/estaticos/api.js"></script>
<style>
.notif-item { display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-bottom:0.5px solid var(--border); transition:background 0.1s; }
.notif-item:hover { background:rgba(255,255,255,0.02); }
.notif-item.unread { background:rgba(34,211,238,0.04); border-left:2px solid var(--accent); }
.notif-dot { width:8px; height:8px; border-radius:50%; background:var(--accent2); flex-shrink:0; margin-top:4px; }
.notif-dot.read { background:var(--text4); }
.notif-title { font-size:12px; font-weight:500; color:var(--text); margin-bottom:3px; }
.notif-body  { font-size:11px; color:var(--text3); line-height:1.5; }
.notif-time  { font-size:10px; color:var(--text4); font-family:var(--mono); margin-top:4px; }
.notif-tipo  { margin-left:auto; flex-shrink:0; }
</style>
</head>
<body>

<aside class="sidebar" id="diabcare-sidebar"></aside>

<div class="main">
  <div class="topbar">
    <span class="tb-crumb">DiabCare</span><span class="tb-sep">/</span><span class="tb-page">Notificaciones</span>
    <div class="tb-right"><div class="tb-online"><div class="tb-online-dot"></div><span class="tb-online-label">MinIO conectado</span></div></div>
  </div>
  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Centro de <span>alertas</span></div>
        <div class="page-sub">Notificaciones y alertas del sistema</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="marcarTodo()">Marcar todo leído</button>
        <button class="btn btn-ghost btn-sm" onclick="cargar()">↺ Recargar</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value blue" id="st-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Sin leer</div><div class="stat-value amber" id="st-unread">—</div></div>
      <div class="stat-card"><div class="stat-label">Críticas</div><div class="stat-value red" id="st-criticas">—</div></div>
      <div class="stat-card"><div class="stat-label">Info</div><div class="stat-value green" id="st-info">—</div></div>
    </div>

    <div class="tabla-card">
      <div class="tabla-top">
        <span class="tabla-title">Notificaciones</span>
        <select class="search" id="f-tipo" style="width:160px" onchange="cargar()">
          <option value="">Todas</option>
          <option value="info">Informativas</option>
          <option value="warning">Advertencias</option>
          <option value="error">Críticas</option>
          <option value="success">Éxito</option>
        </select>
        <span class="tabla-info" id="info">—</span>
      </div>
      <div id="notifList"><div class="loading"><div class="spinner"></div>Cargando notificaciones...</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="t-icon">✓</span><span id="t-msg"></span></div>

<script>
DiabCareNav.init();
const API = DiabCareNav.getApi();
const token = localStorage.getItem('token');
let notifs = [];

function toggle(h) { h.classList.toggle('open'); const s = h.nextElementSibling; if (s) s.classList.toggle('open'); }

function initUser() {
  if (!localStorage.getItem('token')) { window.location.href = '/'; return; }
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  if (u.nombre) {
    document.getElementById('userName').textContent   = u.nombre;
    document.getElementById('userRol').textContent    = u.rol || '';
    document.getElementById('userAvatar').textContent = u.nombre[0].toUpperCase();
  }
  const rol = u.rol || '';
  const ACCESO = {
    'administrador': ['analisis','registros','dataset','usuarios','prediccion','pipeline','modelo','reportes','auditoria','notificaciones','configuracion','benchmarking','integraciones'],
    'medico':        ['analisis','registros','prediccion'],
    'analista':      ['analisis','dataset','prediccion'],
  };
  const permitidos = ACCESO[rol] || [];
  document.querySelectorAll('.nav-group').forEach(g => {
    const label = g.querySelector('.nav-group-label');
    if (!label) return;
    const texto = label.textContent.toLowerCase();
    const visible = permitidos.some(p => texto.includes(p === 'analisis' ? 'nál' : p === 'registros' ? 'egistro' : p === 'dataset' ? 'ataset' : p === 'usuarios' ? 'suario' : p === 'prediccion' ? 'redicci' : p === 'pipeline' ? 'ipeline' : p === 'modelo' ? 'odelo m' : p === 'reportes' ? 'eporte' : p === 'auditoria' ? 'uditor' : p === 'notificaciones' ? 'otificac' : p === 'configuracion' ? 'onfigur' : p === 'benchmarking' ? 'enchmark' : p === 'integraciones' ? 'ntegrac' : p));
    if (!visible) g.style.display = 'none';
  });
}

function cerrarSesion() { localStorage.clear(); window.location.href = '/'; }

function aplicarRoles() {
  const u = JSON.parse(localStorage.getItem('usuario') || '{}');
  const rol = u.rol || '';
  const OCULTAR = {
    'medico':   ['Dataset','Usuarios','Pipeline ELT','Modelo ML','Reportes','Auditoría','Notificaciones','Configuración','Benchmarking','Integraciones'],
    'analista': ['Registros clínicos','Usuarios','Pipeline ELT','Modelo ML','Reportes','Auditoría','Notificaciones','Configuración','Benchmarking','Integraciones'],
  };
  const ocultar = OCULTAR[rol] || [];
  document.querySelectorAll('.nav-group').forEach(g => {
    const label = g.querySelector('.nav-group-label');
    if (!label) return;
    const txt = label.textContent.trim();
if (ocultar.some(o => txt.includes(o))) g.style.display = 'none';
  });
}

function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  document.getElementById('t-msg').textContent  = msg;
  document.getElementById('t-icon').textContent = type === 'success' ? '✓' : '✗';
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function tipoBadge(tipo) {
  if (tipo === 'error')   return 'b-inactivo';
  if (tipo === 'warning') return 'b-analista';
  if (tipo === 'success') return 'b-activo';
  return 'b-admin';
}

async function cargar() {
  document.getElementById('notifList').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
  try {
    const tipo = document.getElementById('f-tipo').value;
    let url = `${API}/api/notificaciones/`;
    if (tipo) url += `?tipo=${tipo}`;
    const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    if (r.status === 401) { window.location.href = '/'; return; }
    notifs = await r.json();
    if (!Array.isArray(notifs)) notifs = notifs.notificaciones || notifs.items || [];

    document.getElementById('st-total').textContent   = notifs.length;
    document.getElementById('st-unread').textContent  = notifs.filter(n => !n.leida && !n.read).length;
    document.getElementById('st-criticas').textContent= notifs.filter(n => n.tipo === 'error').length;
    document.getElementById('st-info').textContent    = notifs.filter(n => n.tipo === 'info' || n.tipo === 'success').length;
    document.getElementById('info').textContent       = notifs.length + ' notificaciones';

    if (!notifs.length) {
      document.getElementById('notifList').innerHTML = '<div class="loading">Sin notificaciones</div>';
      return;
    }

    let h = '';
    notifs.forEach(n => {
      const leida  = n.leida || n.read || false;
      const tiempo = (n.creado_en || n.timestamp || n.fecha || '').replace('T', ' ').split('.')[0];
      h += `<div class="notif-item ${!leida ? 'unread' : ''}">
        <div class="notif-dot ${leida ? 'read' : ''}"></div>
        <div style="flex:1">
          <div class="notif-title">${n.titulo || n.title || n.asunto || 'Notificación'}</div>
          <div class="notif-body">${n.mensaje || n.body || n.descripcion || '—'}</div>
          <div class="notif-time">${tiempo || '—'}</div>
        </div>
        <div class="notif-tipo"><span class="badge ${tipoBadge(n.tipo)}">${n.tipo || 'info'}</span></div>
      </div>`;
    });
    document.getElementById('notifList').innerHTML = h;
  } catch {
    document.getElementById('notifList').innerHTML = '<div class="loading">Error de conexión</div>';
  }
}

async function marcarTodo() {
  try {
    await fetch(`${API}/api/notificaciones/marcar-leidas`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
    toast('Todas marcadas como leídas');
    cargar();
  } catch { toast('Error', 'error'); }
}

cargar();
</script>
</body>
</html>
