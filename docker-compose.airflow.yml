# Apache Airflow — orquestación del Pipeline ELT (demo académica)
# Uso:
#   docker compose -f docker-compose.airflow.yml up -d
# UI: http://localhost:8081  (admin / admin)
# El DAG "diabcare_elt" llama a FastAPI en el host (:8000).
#
# Requisito: backend DiabCare corriendo en localhost:8000 y MinIO/PocketBase disponibles.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  env_file:
    - path: .env
      required: false
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Permitir embeber la UI en DiabCare (misma app, sin otra pestaña)
    AIRFLOW__WEBSERVER__X_FRAME_ENABLED: "True"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    DIABCARE_API: http://host.docker.internal:8000
    DIABCARE_PIPELINE_KEY: ${DIABCARE_PIPELINE_KEY:-diabcare-pipeline-demo}
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow-home:/opt/airflow
  user: "50000:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Diab \
          --lastname Care \
          --role Admin \
          --email admin@diabcare.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-home:
